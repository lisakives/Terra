 *  - torkku ja testi-ilmoitukset
 *  - tilannetiedot ilmoitusasetusnäkymään (asennus, lupa, palvelin)
 */
(function () {
  'use strict';

  const L = GT.life;
  const S = () => GT.Store.get();

  const ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const standalone = () => window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  const supported = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;

  const b64u = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  const unb64u = s => { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; return Uint8Array.from(atob(s), c => c.charCodeAt(0)); };
  const rand = n => b64u(crypto.getRandomValues(new Uint8Array(n)));

  function server() {
    const p = S().push || {};
    return (p.server || GT.PUSH_SERVER || '').replace(/\/+$/, '');
  }

  function identity() {
    const p = S().push;
    if (!p.userId || !p.secret) {
      GT.Store.update(s => { s.push.userId = 'u_' + rand(16); s.push.secret = rand(24); });
      GT.Store.saveNow();
    }
    return { userId: S().push.userId, secret: S().push.secret };
  }

  async function api(path, body, method = 'POST') {
    const base = server();
    if (!base) throw new Error('Ilmoituspalvelinta ei ole määritetty');
    const res = await fetch(base + path, method === 'GET' ? {} : {
      method, headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ...identity(), ...(GT.PUSH_APP_KEY ? { appKey: GT.PUSH_APP_KEY } : {}), ...body })
    });
    let data = {};
    try { data = await res.json(); } catch (e) { /* */ }
    if (!res.ok) throw new Error(data.error || ('Palvelinvirhe ' + res.status));
    return data;
  }

  /** Service worker lukee palvelimen osoitteen ja tunnisteen tästä (torkku ilmoituksen painikkeesta). */
  async function writeSwConfig() {
    try {
      const c = await caches.open('gt-push-config');
      await c.put('push-config', new Response(JSON.stringify({ server: server(), ...identity() }), { headers: { 'Content-Type': 'application/json' } }));
    } catch (e) { /* */ }
  }

  async function registration() {
    if (!('serviceWorker' in navigator)) return null;
    try { return await navigator.serviceWorker.ready; } catch (e) { return null; }
  }

  async function currentSubscription() {
    const reg = await registration();
    if (!reg || !reg.pushManager) return null;
    try { return await reg.pushManager.getSubscription(); } catch (e) { return null; }
  }

  /** Tilannekuva näkymää varten. */
  async function status() {
    const perm = 'Notification' in window ? Notification.permission : 'unsupported';
    const sub = supported() ? await currentSubscription() : null;
    return { ios, standalone: standalone(), supported: supported(), permission: perm, server: server(), subscribed: !!sub && !!S().push.subscribed, endpointHost: sub ? new URL(sub.endpoint).host : null };
  }

  /** Ottaa ilmoitukset käyttöön. Kutsuttava suoraan napautuksesta (iOS vaatii). */
  async function enable() {
    if (!supported()) {
      if (ios && !standalone()) throw new Error('Lisää sovellus ensin Koti-valikkoon (Jaa → Lisää Koti-valikkoon) ja avaa se kotinäytöltä.');
      throw new Error('Tämä selain ei tue push-ilmoituksia.');
    }
    // Lupa pyydetään ensimmäisenä, jotta pyyntö on yhä osa käyttäjän napautusta.
    const perm = await Notification.requestPermission();
    if (perm !== 'granted') throw new Error(perm === 'denied'
      ? 'Ilmoitukset on estetty. Salli ne: Asetukset → Ilmoitukset → GymTrack → Salli ilmoitukset.'
      : 'Ilmoituslupaa ei annettu.');
    if (!server()) throw new Error('Lupa annettu, mutta ilmoituspalvelinta ei ole vielä otettu käyttöön. Katso ohjeet alta.');
    const reg = await registration();
    const { publicKey } = await api('/api/vapid', null, 'GET');
    let sub = await reg.pushManager.getSubscription();
    // Jos palvelimen avain on vaihtunut, vanha tilaus ei kelpaa
    if (sub && sub.options && sub.options.applicationServerKey && b64u(sub.options.applicationServerKey) !== publicKey) {
      await sub.unsubscribe(); sub = null;
    }
    if (!sub) sub = await reg.pushManager.subscribe({ userVisibleOnly: true, applicationServerKey: unb64u(publicKey) });
    await api('/api/subscribe', { subscription: sub.toJSON(), ua: navigator.userAgent, state: L.serverState(S()) });
    GT.Store.update(s => { s.push.subscribed = true; s.push.endpoint = sub.endpoint; s.push.lastSync = new Date().toISOString(); s.push.lastError = null; });
    lastSent = JSON.stringify(L.serverState(S()));
    await writeSwConfig();
    return true;
  }

  async function disable() {
    const sub = await currentSubscription();
    if (sub) {
      try { await api('/api/unsubscribe', { endpoint: sub.endpoint }); } catch (e) { /* palvelin ei vastaa: poistetaan silti */ }
      try { await sub.unsubscribe(); } catch (e) { /* */ }
    }
    GT.Store.update(s => { s.push.subscribed = false; s.push.endpoint = null; });
  }

  /* ---------- Synkronointi ---------- */
  let timer = null, lastSent = null, inflight = false;
  function scheduleSync(delay = 2500) {
    if (!server() || !S().push.subscribed) return;
    clearTimeout(timer);
    timer = setTimeout(syncNow, delay);
  }
  async function syncNow(force) {
    if (!server() || !S().push.subscribed || inflight) return;
    const state = L.serverState(S());
    const key = JSON.stringify(state);
    if (!force && key === lastSent) return;
    inflight = true;
    try {
      await api('/api/sync', { state });
      lastSent = key;
      GT.Store.update(s => { s.push.lastSync = new Date().toISOString(); s.push.lastError = null; });
    } catch (e) {
      GT.Store.update(s => { s.push.lastError = e.message; });
      clearTimeout(timer); timer = setTimeout(syncNow, 60000); // yritetään uudelleen
    } finally { inflight = false; }
  }

  async function snooze(r, minutes) {
    const until = Date.now() + minutes * 60000;
    GT.Store.update(s => { s.snoozed = s.snoozed || {}; s.snoozed[r.id] = until; });
    if (server() && S().push.subscribed) {
      await api('/api/snooze', { rid: r.id, minutes, title: r.title, body: (r.body || '') + ' (torkutettu)' });
    }
    return until;
  }

  const test = (delaySeconds = 0) => api('/api/test', { delaySeconds });
  const serverStatus = () => api('/api/status', {});

  /** Käynnistyksessä: tarkistaa, että tilaus on yhä voimassa, ja palauttaa sen tarvittaessa. */
  async function verify() {
    if (!supported() || !server()) return;
    await writeSwConfig();
    if (!S().push.subscribed) return;
    if (Notification.permission !== 'granted') { GT.Store.update(s => { s.push.subscribed = false; }); return; }
    const sub = await currentSubscription();
    if (!sub || sub.endpoint !== S().push.endpoint) {
      try { await enable(); } catch (e) { GT.Store.update(s => { s.push.lastError = e.message; }); }
    } else syncNow(true);
  }

  GT.push = { ios, standalone, supported, server, status, enable, disable, scheduleSync, syncNow, snooze, test, serverStatus, verify, writeSwConfig };
})();

</script>
<script>/* js/lifeviews.js */
/* GymTrack – elämäntapanäkymät: Tänään, Ruoka, Muistutukset, Ilmoitukset, Viikkoraportti */
(function () {
  'use strict';

  const { esc, icon } = GT.ui;
  const M = GT.model, F = GT.fmt, L = GT.life, C = GT.charts;
  const S = () => GT.Store.get();
  const V = GT.views, VS = GT.viewState;
  Object.assign(VS, { foodDate: null, foodReport: 'week', foodReportOffset: 0, reportWeek: null, pushStatus: null, serverStatus: null, bodyGroup: 'all' });

  const DAY2 = ['ma', 'ti', 'ke', 'to', 'pe', 'la', 'su'];
  const kcal = v => Math.round(v || 0).toLocaleString('fi-FI');
  const g = v => F.num(v, 0) + ' g';
  const time = t => t.replace(':', '.');

  function header(title, { back, sub, right = '', large = false } = {}) {
    return `<header class="top ${large ? 'top-large' : ''}"><div class="top-row">
      ${back ? `<a class="icon-btn" href="#/${back}" aria-label="Takaisin">${icon('back')}</a>` : ''}
      <div class="top-titles">${sub ? `<div class="top-sub">${sub}</div>` : ''}<h1>${title}</h1></div>
      <div class="top-right">${right}</div></div></header>`;
  }

  function relTime(at) {
    const mins = Math.round((at - Date.now()) / 60000);
    if (mins < 1) return 'nyt';
    if (mins < 60) return `${mins} min päästä`;
    const h = Math.floor(mins / 60), m = mins % 60;
    if (h < 24) return `${h} h ${m ? m + ' min ' : ''}päästä`;
    return F.dateLong(at);
  }
  const atLabel = at => {
    const t = L.iso(at), tt = L.today();
    const hmTxt = time(L.hm(at));
    if (t === tt) return 'Tänään ' + hmTxt;
    if (t === L.addDays(tt, 1)) return 'Huomenna ' + hmTxt;
    return DAY2[L.weekday(t)] + ' ' + hmTxt;
  };
  const daysText = d => !d || !d.length || d.length === 7 ? 'Joka päivä' : d.length === 5 && [0, 1, 2, 3, 4].every(x => d.includes(x)) ? 'Arkisin' : d.slice().sort().map(x => DAY2[x]).join(', ');

  function macroBar(label, val, goal, unit = 'g') {
    const pct = goal ? Math.min(100, val / goal * 100) : 0;
    const over = goal && val > goal * 1.1;
    return `<div class="macro"><div class="macro-top"><span>${label}</span><b>${F.num(val, 0)}${goal ? `<small> / ${goal} ${unit}</small>` : ` ${unit}`}</b></div>
      <div class="macro-bar"><i class="${over ? 'over' : ''}" style="width:${pct.toFixed(0)}%"></i></div></div>`;
  }

  function pushBanner() {
    const st = S();
    if (st.push && st.push.subscribed && (!('Notification' in window) || Notification.permission === 'granted')) return '';
    const ps = VS.pushStatus;
    let text = 'Ota puhelimen ilmoitukset käyttöön, niin muistutukset tulevat myös sovelluksen ollessa suljettuna.';
    if (ps && ps.permission === 'denied') text = 'Ilmoitukset on estetty puhelimen asetuksista. Katso ohjeet.';
    else if (GT.push.ios && !GT.push.standalone()) text = 'Lisää sovellus Koti-valikkoon, jotta iPhone voi näyttää muistutukset.';
    return `<a class="card card-link notice" href="#/notifications">${icon('bell')}<div class="grow"><b>Ilmoitukset eivät ole päällä</b><div class="muted sm">${text}</div></div>${icon('chevron', 'muted')}</a>`;
  }


  /* ---------- Ajo keikalla ---------- */
  function tripCard() {
    const st = S();
    const t = st.trip;
    const today = L.today();
    if (t && t.to >= today) {
      const days = Math.round((L.parseISO(t.to) - L.parseISO(today)) / 86400000) + 1;
      const fmt = d => F.date(L.parseISO(d), { day: 'numeric', month: 'numeric' });
      return `<section class="card trip-card on">
        <div class="row-between"><div class="card-label">${icon('swap', 'inline')} Olen töissä</div><button class="link sm" data-action="trip-end">Lopeta</button></div>
        <div class="name-md">${fmt(t.from)}–${fmt(t.to)}</div>
        <div class="muted sm">${t.from <= today ? `Töissä nyt, ${days} pv jäljellä` : `Alkaa ${fmt(t.from)}`}. Ateriamuistutukset kertovat työpäivän ohjeen.</div>
      </section>`;
    }
    return `<section class="card trip-card">
      <div class="card-label">${icon('swap', 'inline')} Olen töissä</div>
      <div class="muted sm">Työpäivinä ateriamuistutukset muuttuvat työpäivän ohjeeksi.</div>
      <div class="chips">
        <button class="chip" data-action="trip-start" data-offset="0">Olen töissä</button>
        <button class="chip" data-action="trip-start" data-offset="1">Olen huomenna töissä</button>
      </div>
    </section>`;
  }
  GT.tripCard = tripCard;

  /* ================= TÄNÄÄN ================= */
  V.today = () => {
    const st = S();
    const t = L.today();
    const tp = L.taskProgress(st, t);
    const next = L.nextReminder(st);
    const tot = L.dayTotals(st, t);
    const goals = st.food.goals;
    const sched = M.nextScheduled(st);
    const active = M.activeSession(st);
    const wd = L.weekday(t);
    const showReport = wd === 0 || wd === 6;
    const reportWeek = wd === 6 ? L.weekStartISO(t) : L.addDays(L.weekStartISO(t), -7);
    const meals = L.MEALS.map(m => ({ ...m, list: L.entriesOn(st, t).filter(e => e.meal === m.key) }));
    const snz = st.snoozed || {};

    return `
      <header class="top top-home"><div class="top-row">
        <div class="top-titles"><div class="wordmark">TÄNÄÄN</div><div class="top-sub">${F.dateLong(new Date())}</div></div>
        <div class="top-right"><a class="icon-btn" href="#/settings" aria-label="Asetukset">${icon('settings')}</a></div>
      </div></header>
      <main class="content">
        ${pushBanner()}
        ${st.trip && st.trip.to >= t ? tripCard() : ''}
        ${active ? `<a class="active-banner" href="#/session"><span class="pulse"></span><span class="ab-text"><b>${esc(active.workoutName)} käynnissä</b><span data-elapsed="${active.startedAt}">${F.clock(Date.now() - new Date(active.startedAt))}</span></span><span class="ab-cta">Jatka ${icon('chevron')}</span></a>` : ''}

        <section class="card today-top">
          <div class="tt-ring">${C.ring(tp.total ? tp.done / tp.total : 0)}<div class="ring-num"><b data-count="${tp.pct}">${tp.pct}</b><span>%</span></div></div>
          <div class="grow">
            <div class="card-label">Päivän tehtävät</div>
            <div class="week-text">${tp.done}/${tp.total} tehty${tp.total && tp.done === tp.total ? ' 🎉' : ''}</div>
            ${next ? `<div class="next-rem">${icon('bell', 'inline')} <span>Seuraava: <b>${atLabel(next.at)}</b> ${esc(next.r.title)}${next.snoozed ? ' (torkku)' : ''}</span></div>
              <div class="muted sm">${relTime(+next.at)}</div>` : '<div class="muted sm">Ei tulevia muistutuksia</div>'}
          </div>
        </section>

        <section class="card">
          <ul class="task-list">${tp.list.map(x => `<li class="${x.done ? 'done' : ''}">
              <button class="task-check" data-action="task-toggle" data-id="${x.r.id}" aria-label="Merkitse tehdyksi">${icon('check')}</button>
              <button class="task-main" data-action="task-menu" data-id="${x.r.id}">
                <span class="task-time">${time(x.r.time)}</span>
                <span class="task-title">${esc(x.r.title)}${snz[x.r.id] > Date.now() && !x.done ? `<small class="snz">${icon('timer', 'inline')} ${time(L.hm(new Date(snz[x.r.id])))}</small>` : ''}</span>
              </button></li>`).join('') || '<li class="muted sm">Ei tehtäviä tälle päivälle.</li>'}
          </ul>
          <a class="link sm" href="#/reminders">Muokkaa muistutuksia</a>
        </section>

        ${sched && !active ? `<a class="card card-link" href="#/home"><div class="row-between"><div class="card-label">Treeni · ${esc(sched.label)}</div>${icon('chevron', 'muted')}</div>
          <div class="name-md">${esc(sched.workout.name)}</div><div class="muted sm">${esc(sched.workout.subtitle || '')}</div></a>` : ''}

        <section class="quick-grid">
          <button class="quick" data-action="quick-weight">${icon('body')}<span>Paino</span></button>
          
          ${!active && sched && sched.offset === 0 ? `<button class="quick hl" data-action="start-workout" data-id="${sched.workout.id}">${icon('play')}<span>${esc(sched.workout.name)}</span></button>` : `<a class="quick" href="#/home">${icon('dumbbell')}<span>Treeni</span></a>`}
          <a class="quick" href="#/report">${icon('note')}<span>Raportti</span></a>
          <a class="quick" href="#/food">${icon('food')}<span>Ruoka</span></a>
        </section>

        ${showReport ? (() => {
          const rep = L.weeklyReport(st, reportWeek);
          return `<a class="card card-link report-teaser" href="#/report/${reportWeek}">
            <div class="row-between"><div class="card-label">${wd === 6 ? 'Tämän viikon raportti' : 'Viime viikon raportti'}</div>${icon('chevron', 'muted')}</div>
            <div class="kv"><div><span>Treenit</span><b>${rep.workouts}${rep.plannedWorkouts ? '/' + rep.plannedWorkouts : ''}</b></div><div><span>Paino</span><b>${rep.weight.change !== null ? (rep.weight.change > 0 ? '+' : '') + F.num(rep.weight.change) + ' kg' : '–'}</b></div><div><span>Tehtävät</span><b>${rep.tasksTotal ? Math.round(rep.tasksDone / rep.tasksTotal * 100) + ' %' : '–'}</b></div></div>
          </a>`;
        })() : ''}

      </main>`;
  };

  /* ================= RUOKA ================= */
  function foodTabs(on) {
    return `<div class="segmented mb"><a class="${on === 'day' ? 'on' : ''}" href="#/food">Päivä</a><a class="${on === 'week' ? 'on' : ''}" href="#/food-report/week">Viikko</a><a class="${on === 'month' ? 'on' : ''}" href="#/food-report/month">Kuukausi</a></div>`;
  }

  V.food = (dateArg) => {
    const st = S();
    const date = dateArg && /^\d{4}-\d{2}-\d{2}$/.test(dateArg) ? dateArg : L.today();
    VS.foodDate = date;
    const t = L.today();
    const tot = L.dayTotals(st, date);
    const goals = st.food.goals;
    const left = goals.kcal ? goals.kcal - tot.kcal : null;
    const dayLabel = date === t ? 'Tänään' : date === L.addDays(t, -1) ? 'Eilen' : F.dateLong(L.parseISO(date));
    const favs = st.food.favorites.slice().sort((a, b) => (b.uses || 0) - (a.uses || 0)).slice(0, 8);
    const prevDay = L.addDays(date, -1);

    return `
      ${header('Ruoka', { large: true, right: `<button class="icon-btn" data-action="food-menu" aria-label="Ruokavalikko">${icon('list')}</button>` })}
      <main class="content">
        ${foodTabs('day')}
        <div class="date-nav">
          <a class="icon-btn" href="#/food/${L.addDays(date, -1)}" aria-label="Edellinen päivä">${icon('back')}</a>
          <b>${dayLabel}</b>
          ${date < t ? `<a class="icon-btn" href="#/food/${L.addDays(date, 1)}" aria-label="Seuraava päivä">${icon('chevron')}</a>` : '<span class="icon-btn ghost"></span>'}
        </div>
        <section class="card food-total">
          <div class="ft-head">
            <div><div class="big"><span data-count="${tot.kcal}">${kcal(tot.kcal)}</span><small> kcal</small></div>
              <div class="muted sm">${left === null ? '' : left >= 0 ? `${kcal(left)} kcal jäljellä` : `${kcal(-left)} kcal yli tavoitteen`}</div></div>
            <div class="ft-ring">${C.ring(goals.kcal ? tot.kcal / goals.kcal : 0, { size: 64, stroke: 7 })}</div>
          </div>
          ${macroBar('Proteiini', tot.p, goals.protein)}
          ${macroBar('Hiilihydraatit', tot.c, goals.carbs)}
          ${macroBar('Rasva', tot.f, goals.fat)}
        </section>

        <button class="btn btn-primary btn-block btn-lg" data-action="food-add" data-date="${date}">${icon('plus')} Lisää ruoka</button>
        ${favs.length ? `<div class="fav-row">${favs.map(f => `<button class="chip fav-chip" data-action="fav-add" data-id="${f.id}" data-date="${date}">${icon('plus', 'inline')} ${esc(f.name)} <small>${kcal(f.items.reduce((n, i) => n + i.kcal, 0))}</small></button>`).join('')}</div>` : ''}

        ${L.MEALS.map(m => {
          const list = L.entriesOn(st, date).filter(e => e.meal === m.key);
          const mt = L.totals(list);
          const prevList = L.entriesOn(st, prevDay).filter(e => e.meal === m.key);
          return `<section class="card meal">
            <div class="row-between meal-head">
              <div><b>${m.label}</b>${list.length ? `<span class="muted sm"> · ${kcal(mt.kcal)} kcal · P ${g(mt.p)}</span>` : ''}</div>
              <div class="row-actions">
                ${list.length ? `<button class="icon-btn sm" data-action="meal-menu" data-meal="${m.key}" data-date="${date}" aria-label="Aterian toiminnot">${icon('settings')}</button>` : ''}
                <button class="icon-btn sm" data-action="food-add" data-meal="${m.key}" data-date="${date}" aria-label="Lisää ${m.label}">${icon('plus')}</button>
              </div>
            </div>
            ${list.length ? `<ul class="food-list">${list.map(e => `<li data-action="food-entry" data-id="${e.id}">
                <div class="grow"><b>${esc(e.name)}</b><span class="muted sm">${F.num(e.amount)} ${esc(e.unit || 'g')} · P ${F.num(e.p)} · H ${F.num(e.c)} · R ${F.num(e.f)}</span></div>
                <span class="fl-kcal">${kcal(e.kcal)}</span></li>`).join('')}</ul>`
              : prevList.length ? `<button class="btn btn-ghost btn-sm" data-action="meal-copy" data-meal="${m.key}" data-from="${prevDay}" data-date="${date}">${icon('swap')} Toista edellisen päivän ateria (${kcal(L.totals(prevList).kcal)} kcal)</button>` : ''}
          </section>`;
        }).join('')}
        <a class="btn btn-ghost btn-block" href="#/food-favs">${icon('trophy')} Suosikit (${st.food.favorites.length})</a>
      </main>`;
  };

  V.foodReport = (kind) => {
    const st = S();
    kind = kind === 'month' ? 'month' : 'week';
    if (VS.foodReport !== kind) { VS.foodReport = kind; VS.foodReportOffset = 0; }
    const off = VS.foodReportOffset;
    let from, days, title;
    if (kind === 'week') {
      from = L.addDays(L.weekStartISO(), off * 7); days = 7;
      title = `${F.date(L.parseISO(from), { day: 'numeric', month: 'numeric' })}–${F.date(L.parseISO(L.addDays(from, 6)), { day: 'numeric', month: 'numeric' })}`;
    } else {
      const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() + off);
      from = L.iso(d); const e = new Date(d); e.setMonth(e.getMonth() + 1); e.setDate(0); days = e.getDate();
      title = d.toLocaleDateString('fi-FI', { month: 'long', year: 'numeric' });
      title = title.charAt(0).toUpperCase() + title.slice(1);
    }
    const s = L.rangeStats(st, from, days);
    const goals = st.food.goals;
    const items = s.days.map(d => ({ label: kind === 'week' ? DAY2[L.weekday(d.date)] : String(+d.date.slice(8)), v: d.kcal, hint: `${d.date}: ${d.kcal} kcal` }));
    const pItems = s.days.map(d => ({ label: kind === 'week' ? DAY2[L.weekday(d.date)] : String(+d.date.slice(8)), v: d.p }));
    const w = L.weightTrend(st, from, L.addDays(from, days - 1));
    return `
      ${header('Ruoka', { large: true, right: `<button class="icon-btn" data-action="food-menu" aria-label="Ruokavalikko">${icon('list')}</button>` })}
      <main class="content">
        ${foodTabs(kind)}
        <div class="date-nav">
          <button class="icon-btn" data-action="report-shift" data-v="-1" aria-label="Edellinen">${icon('back')}</button>
          <b>${title}</b>
          ${off < 0 ? `<button class="icon-btn" data-action="report-shift" data-v="1" aria-label="Seuraava">${icon('chevron')}</button>` : '<span class="icon-btn ghost"></span>'}
        </div>
        <section class="stat-grid">
          <div class="card stat"><div class="card-label">Ka. kalorit</div><div class="big sm">${s.logged ? kcal(s.avgKcal) : '–'}<small> kcal</small></div><div class="muted sm">Tavoite ${kcal(goals.kcal)}</div></div>
          <div class="card stat"><div class="card-label">Ka. proteiini</div><div class="big sm">${s.logged ? F.num(s.avgP, 0) : '–'}<small> g</small></div><div class="muted sm">Tavoite ${goals.protein} g</div></div>
          <div class="card stat"><div class="card-label">Kirjatut päivät</div><div class="big sm">${s.logged}<small> / ${s.past || days}</small></div><div class="muted sm">${s.past ? Math.round(s.logged / s.past * 100) : 0} % toteutuma</div></div>
          <div class="card stat"><div class="card-label">Kalorit tavoitteessa</div><div class="big sm">${s.kcalHits}<small> pv</small></div><div class="muted sm">±10 % · proteiini ${s.proteinHits} pv</div></div>
        </section>
        <section class="card"><div class="card-label">Kalorit päivittäin</div>${C.bars(items, { goal: goals.kcal })}</section>
        <section class="card"><div class="card-label">Proteiini päivittäin (g)</div>${C.bars(pItems, { goal: goals.protein })}</section>
        <section class="card"><div class="card-label">Makrot keskimäärin</div>
          ${macroBar('Proteiini', s.avgP, goals.protein)}${macroBar('Hiilihydraatit', s.avgC, goals.carbs)}${macroBar('Rasva', s.avgF, goals.fat)}
          ${w.last ? `<div class="muted sm mt-sm">Paino jakson lopussa ${F.num(w.last.value)} kg${w.change !== null ? ` (${w.change > 0 ? '+' : ''}${F.num(w.change)} kg)` : ''}</div>` : ''}
        </section>
        ${kind === 'week' ? `<a class="btn btn-soft btn-block" href="#/report/${from}">${icon('note')} Koko viikkoraportti</a>` : ''}
      </main>`;
  };

  V.foodFavs = () => {
    const st = S();
    return `
      ${header('Suosikit', { back: 'food', sub: 'Ruoka' })}
      <main class="content">
        ${st.food.favorites.length ? `<ul class="list card">${st.food.favorites.map(f => {
          const t = L.totals(f.items);
          return `<li class="list-row"><div class="grow"><b>${esc(f.name)}</b><div class="muted sm">${f.items.length > 1 ? f.items.length + ' ruokaa · ' : ''}${kcal(t.kcal)} kcal · P ${g(t.p)}${f.uses ? ' · käytetty ' + f.uses + ' krt' : ''}</div></div>
            <div class="row-actions"><button class="icon-btn sm" data-action="fav-add" data-id="${f.id}" aria-label="Lisää tänään">${icon('plus')}</button>
            <button class="icon-btn sm danger" data-action="fav-delete" data-id="${f.id}" aria-label="Poista suosikki">${icon('trash')}</button></div></li>`;
        }).join('')}</ul>` : `<div class="empty"><div class="empty-ic">${icon('trophy')}</div><h3>Ei vielä suosikkeja</h3><p>Tallenna ruoka tai koko ateria suosikiksi napauttamalla sitä ruokapäiväkirjassa. Suosikin saa lisättyä yhdellä napautuksella.</p></div>`}
      </main>`;
  };

  /* ================= MUISTUTUKSET ================= */
  V.reminders = () => {
    const st = S();
    const list = st.reminders.slice().sort((a, b) => a.time.localeCompare(b.time));
    const t = L.today();
    const done = st.tasks.done[t] || {};
    return `
      ${header('Muistutukset', { large: true, right: `<button class="icon-btn" data-action="rem-menu" aria-label="Muistutusvalikko">${icon('plus')}</button>` })}
      <main class="content">
        ${tripCard()}
        ${pushBanner() || `<a class="card card-link notice ok" href="#/notifications">${icon('bell')}<div class="grow"><b>Ilmoitukset päällä</b><div class="muted sm">Muistutukset tulevat myös sovelluksen ollessa suljettuna.</div></div>${icon('chevron', 'muted')}</a>`}
        <ul class="list card rem-list">
          ${list.map(r => `<li class="list-row ${r.enabled === false ? 'off' : ''}">
            <div class="grow" data-action="rem-edit" data-id="${r.id}">
              <div class="rem-time">${time(r.time)}${done[r.id] ? `<span class="badge ok">${icon('check', 'inline')} tehty</span>` : ''}</div>
              <b>${esc(r.title)}</b>
              <div class="muted sm">${daysText(r.days)}${r.notify === false ? ' · ei ilmoitusta' : ''}</div>
            </div>
            <label class="toggle compact" aria-label="Käytössä"><input type="checkbox" data-bind="rem-enabled" data-id="${r.id}" ${r.enabled !== false ? 'checked' : ''}><i></i></label>
          </li>`).join('') || '<li class="list-row muted">Ei muistutuksia.</li>'}
        </ul>
        <button class="btn btn-soft btn-block" data-action="rem-new">${icon('plus')} Uusi muistutus</button>
        <button class="btn btn-ghost btn-block" data-action="rem-reset">Palauta oletusmuistutukset</button>
        <p class="muted sm center mt">Jokainen muistutus on myös päivän tehtävä. Kun kirjaat aterian, sitä vastaava ateriamuistutus merkitään tehdyksi eikä siitä enää muistuteta.</p>
      </main>`;
  };

  /* ================= ILMOITUKSET ================= */
  function step(ok, title, body, warn) {
    return `<li class="step ${ok ? 'ok' : warn ? 'warn' : ''}"><span class="step-ic">${ok ? icon('check') : warn ? '!' : '•'}</span><div class="grow"><b>${title}</b>${body ? `<div class="muted sm">${body}</div>` : ''}</div></li>`;
  }

  V.notifications = () => {
    const st = S();
    const ps = VS.pushStatus;
    if (!ps) { refreshPushStatus(); }
    const p = st.push;
    const installed = ps ? (!ps.ios || ps.standalone) : true;
    const perm = ps ? ps.permission : '…';
    const serverOk = !!(ps && ps.server);
    const subOk = !!(ps && ps.subscribed);
    const sv = VS.serverStatus;
    return `
      ${header('Ilmoitukset', { back: 'reminders', sub: 'Muistutukset' })}
      <main class="content">
        <section class="card">
          <ol class="steps">
            ${step(installed, 'Asennettu kotinäyttöön', ps && ps.ios && !ps.standalone ? 'Avaa sovellus Safarissa → Jaa-painike → <b>Lisää Koti-valikkoon</b>. Avaa sitten sovellus kotinäytön kuvakkeesta ja palaa tähän näkymään. iPhone näyttää verkkosovelluksen ilmoitukset vain kotinäytöltä avattuna (iOS 16.4 tai uudempi).' : ps && !ps.ios ? 'Selain tukee ilmoituksia ilman asennusta.' : '', ps && ps.ios && !ps.standalone)}
            ${step(serverOk, 'Ilmoituspalvelin', serverOk ? esc(ps.server.replace(/^https:\/\//, '')) : 'Palvelinta ei ole vielä otettu käyttöön. Ohjeet ovat sovelluksen README-tiedostossa (GitHub). Kun palvelin on käytössä, sen osoite tulee tähän automaattisesti tai voit liittää sen alle.', !serverOk)}
            ${step(perm === 'granted', 'Ilmoituslupa', perm === 'granted' ? 'Sallittu' : perm === 'denied' ? 'Estetty. Salli: iPhonen <b>Asetukset → Ilmoitukset → GymTrack → Salli ilmoitukset</b>. Palaa sitten tähän ja napauta "Ota ilmoitukset käyttöön".' : perm === 'unsupported' ? 'Tämä selain ei tue ilmoituksia tässä tilassa.' : 'Ei vielä pyydetty', perm === 'denied')}
            ${step(subOk, 'Push-tilaus palvelimella', subOk ? `Aktiivinen (${esc(ps.endpointHost || '')})${p.lastSync ? ' · synkronoitu ' + new Date(p.lastSync).toLocaleTimeString('fi-FI', { hour: '2-digit', minute: '2-digit' }) : ''}` : 'Ei vielä', false)}
          </ol>
          ${p.lastError ? `<div class="hint err">${icon('x', 'inline')} ${esc(p.lastError)}</div>` : ''}
          ${subOk ? '' : `<button class="btn btn-primary btn-block btn-lg" data-action="push-enable" ${ps && ps.ios && !ps.standalone ? 'disabled' : ''}>${icon('bell')} Ota ilmoitukset käyttöön</button>`}
        </section>

        ${subOk ? `<div class="section-title">Testaa</div>
        <section class="card">
          <button class="btn btn-soft btn-block" data-action="push-test" data-v="0">${icon('bell')} Lähetä testi-ilmoitus nyt</button>
          <button class="btn btn-soft btn-block" data-action="push-test" data-v="60">${icon('timer')} Testi minuutin päästä</button>
          <p class="muted sm">Napauta "Testi minuutin päästä" ja sulje sovellus kokonaan (pyyhkäise ylös sovellusvaihtajassa). Ilmoituksen pitäisi tulla lukitusnäytölle noin minuutin kuluttua.</p>
          <button class="btn btn-ghost btn-block" data-action="push-status">Näytä palvelimen tila</button>
          ${sv ? `<div class="server-log">
            <div class="muted sm">Ajastin ajettu viimeksi: ${sv.lastRun ? new Date(sv.lastRun).toLocaleTimeString('fi-FI') : 'ei vielä'}</div>
            ${(sv.subscriptions || []).map(s => `<div class="muted sm">Laite ${esc(s.host)}: ${s.lastOk ? 'viimeksi toimitettu ' + new Date(s.lastOk).toLocaleString('fi-FI') : 'ei vielä toimituksia'}${s.lastError ? ' · virhe ' + esc(s.lastError) : ''}</div>`).join('')}
            ${(sv.pending || []).map(o => `<div class="muted sm">Odottaa: ${esc(o.title)} klo ${new Date(o.at).toLocaleTimeString('fi-FI', { hour: '2-digit', minute: '2-digit' })}</div>`).join('')}
            <ul class="mini-hist">${(sv.log || []).map(l => `<li><span class="muted">${new Date(l.at).toLocaleString('fi-FI', { day: 'numeric', month: 'numeric', hour: '2-digit', minute: '2-digit' })}</span><span>${esc(l.title)} ${l.status > 0 ? '✓' : '✗ ' + esc(l.info || '')}</span></li>`).join('')}</ul>
          </div>` : ''}
        </section>` : ''}

        <div class="section-title">Palvelimen osoite</div>
        <section class="card">
          <label class="field"><span>Push-palvelimen osoite</span><input data-bind="push-server" value="${esc(p.server || '')}" placeholder="${esc(GT.PUSH_SERVER || 'https://gymtrack-push.<tunnus>.workers.dev')}" autocomplete="off" autocapitalize="off" spellcheck="false" inputmode="url"></label>
          <p class="muted sm">Jätä tyhjäksi, niin käytetään sovellukseen asetettua osoitetta${GT.PUSH_SERVER ? '' : ' (ei vielä asetettu)'}.</p>
          ${subOk ? `<button class="btn btn-danger-ghost btn-block" data-action="push-disable">Poista ilmoitukset käytöstä tällä laitteella</button>` : ''}
        </section>
      </main>`;
  };

  let refreshing = false;
  async function refreshPushStatus() {
    if (refreshing) return;
    refreshing = true;
    try { VS.pushStatus = await GT.push.status(); } catch (e) { VS.pushStatus = { permission: 'unsupported' }; }
    refreshing = false;
    GT.render && GT.render();
  }
  GT.refreshPushStatus = refreshPushStatus;

  /* ================= VIIKKORAPORTTI ================= */
  V.report = (ws) => {
    const st = S();
    const t = L.today();
    const cur = L.weekStartISO(t);
    // oletuksena viime viikko; sunnuntaina kuluva viikko
    const def = L.weekday(t) === 6 ? cur : L.addDays(cur, -7);
    const start = ws && /^\d{4}-\d{2}-\d{2}$/.test(ws) ? L.weekStartISO(ws) : def;
    const r = L.weeklyReport(st, start);
    const goals = st.food.goals;
    const items = r.days.map(d => ({ label: DAY2[L.weekday(d.date)], v: d.kcal }));
    const taskPct = r.tasksTotal ? Math.round(r.tasksDone / r.tasksTotal * 100) : null;
    const wk = (() => { const d = L.parseISO(start); const jan4 = new Date(d.getFullYear(), 0, 4); const w1 = L.parseISO(L.weekStartISO(L.iso(jan4))); return Math.round((d - w1) / 604800000) + 1; })();
    return `
      ${header('Viikkoraportti', { back: 'today', sub: `Viikko ${wk} · ${F.date(L.parseISO(start), { day: 'numeric', month: 'numeric' })}–${F.date(L.parseISO(r.weekEnd), { day: 'numeric', month: 'numeric' })}` })}
      <main class="content">
        <div class="date-nav">
          <a class="icon-btn" href="#/report/${L.addDays(start, -7)}" aria-label="Edellinen viikko">${icon('back')}</a>
          <b>${start === cur ? 'Tämä viikko' : start === L.addDays(cur, -7) ? 'Viime viikko' : 'Viikko ' + wk}</b>
          ${start < cur ? `<a class="icon-btn" href="#/report/${L.addDays(start, 7)}" aria-label="Seuraava viikko">${icon('chevron')}</a>` : '<span class="icon-btn ghost"></span>'}
        </div>
        <section class="stat-grid">
          <div class="card stat"><div class="card-label">Treenit</div><div class="big sm">${r.workouts}<small>${r.plannedWorkouts ? ' / ' + r.plannedWorkouts : ''}</small></div><div class="muted sm">Kuntosali</div></div>
          <div class="card stat"><div class="card-label">Paino</div><div class="big sm">${r.weight.last ? F.num(r.weight.last.value) + '<small> kg</small>' : '–'}</div><div class="muted sm">${r.weight.change !== null ? `${r.weight.change > 0 ? '+' : ''}${F.num(r.weight.change)} kg ${r.weight.prev ? 'edellisestä' : 'viikon aikana'}` : r.weight.last ? 'Yksi mittaus' : 'Ei mittauksia'}</div></div>
          <div class="card stat" style="grid-column:1/-1"><div class="card-label">Tehtävät</div><div class="big sm">${r.tasksDone}<small> / ${r.tasksTotal}</small></div><div class="muted sm">${taskPct === null ? '–' : taskPct + ' % suoritettu'}</div></div>
        </section>
        <section class="card tips"><div class="card-label">${icon('up', 'inline')} Parannettavaa ensi viikolle</div>
          <ul class="guide">${r.tips.map(x => `<li>${esc(x)}</li>`).join('')}</ul></section>
        ${r.logged ? `<div class="section-title">Ruoka <span class="muted sm">(valinnainen)</span></div>
        <section class="card"><div class="kv"><div><span>Kirjattu</span><b>${r.logged}/7 pv</b></div><div><span>Ka. kcal</span><b>${kcal(r.avgKcal)}</b></div><div><span>Ka. proteiini</span><b>${F.num(r.avgP, 0)} g</b></div></div><div class="card-label">Kalorit päivittäin</div>${C.bars(items, { goal: goals.kcal })}</section>` : ''}
      </main>`;
  };

  /* ================= KEHON MITAT: viikko- ja kuukausinäkymä ================= */
  /** Ryhmittelee mittaukset viikoittain tai kuukausittain (keskiarvo). */
  GT.groupMeasures = (list, mode) => {
    if (mode !== 'week' && mode !== 'month') return null;
    const groups = new Map();
    list.forEach(m => {
      const k = mode === 'week' ? L.weekStartISO(m.date) : m.date.slice(0, 7) + '-01';
      const gr = groups.get(k) || { key: k, sum: 0, n: 0 };
      gr.sum += m.value; gr.n++;
      groups.set(k, gr);
    });
    return Array.from(groups.values()).sort((a, b) => b.key.localeCompare(a.key)).map(gr => ({
      key: gr.key, value: Math.round(gr.sum / gr.n * 10) / 10, n: gr.n,
      label: mode === 'week' ? 'Vk ' + F.date(L.parseISO(gr.key), { day: 'numeric', month: 'numeric' }) : (s => s.charAt(0).toUpperCase() + s.slice(1))(L.parseISO(gr.key).toLocaleDateString('fi-FI', { month: 'long', year: 'numeric' }))
    }));
  };
})();

</script>
<script>/* js/openfood.js */
/* GymTrack – Open Food Facts -haku (verkko). Tiedot: openfoodfacts.org, lisenssi ODbL.
 * Käytetään vain, kun käyttäjä hakee ruokaa tai syöttää viivakoodin.
 * Palauttaa tuotteet samassa muodossa kuin sisäinen ruokatietokanta (arvot / 100 g). */
(function () {
  'use strict';
  const BASE = 'https://world.openfoodfacts.org';
  const FIELDS = 'code,product_name,product_name_fi,brands,nutriments';

  const num = x => { const n = Number(x); return x !== null && x !== '' && Number.isFinite(n) ? n : null; };
  const round = v => Math.round(v * 10) / 10;

  // Muuntaa Open Food Facts -tuotteen GymTrackin ruokariviksi. Palauttaa null, jos arvot puuttuvat.
  function toItem(p) {
    if (!p) return null;
    const n = p.nutriments || {};
    let kcal = num(n['energy-kcal_100g']);
    if (kcal === null) { const kj = num(n['energy_100g']); if (kj !== null) kcal = kj / 4.184; }
    const pr = num(n.proteins_100g), c = num(n.carbohydrates_100g), f = num(n.fat_100g);
    const name = String(p.product_name_fi || p.product_name || '').trim();
    if (!name || kcal === null || pr === null || c === null || f === null) return null;
    const brand = String(p.brands || '').split(',')[0].trim();
    const full = brand && !name.toLowerCase().includes(brand.toLowerCase()) ? `${name} (${brand})` : name;
    return {
      name: full, amount: 100, unit: 'g',
      per100: { kcal: round(kcal), p: round(pr), c: round(c), f: round(f) },
      por: null, db: false, src: 'off', code: String(p.code || '')
    };
  }

  async function get(url) {
    const ctl = new AbortController();
    const timer = setTimeout(() => ctl.abort(), 7000);
    try {
      const r = await fetch(url, { signal: ctl.signal, headers: { Accept: 'application/json' } });
      if (!r.ok) throw new Error('HTTP ' + r.status);
      return await r.json();
    } finally { clearTimeout(timer); }
  }

  // Nimihaku: vaatii vähintään 3 merkkiä.
  async function search(q) {
    q = String(q || '').trim();
    if (q.length < 3) return [];
    const url = `${BASE}/api/v2/search?search_terms=${encodeURIComponent(q)}&page_size=12&fields=${FIELDS}`;
    const data = await get(url);
    return (data.products || []).map(toItem).filter(Boolean).slice(0, 10);
  }

  // Viivakoodihaku (EAN-8/12/13/14). Palauttaa null, jos tuotetta ei löydy tai tiedot puuttuvat.
  async function byCode(code) {
    code = String(code || '').replace(/\D/g, '');
    if (code.length < 8) return null;
    const data = await get(`${BASE}/api/v2/product/${code}.json?fields=${FIELDS}`);
    return data.status === 1 ? toItem(data.product) : null;
  }

  GT.OFF = { toItem, search, byCode };
})();

</script>
<script>/* js/lifeactions.js */
/* GymTrack – elämäntapatoimintojen tapahtumankäsittelijät */
(function () {
  'use strict';

  const ui = GT.ui, { esc, icon } = ui;
  const M = GT.model, F = GT.fmt, L = GT.life, Store = GT.Store, VS = GT.viewState;
  const S = () => Store.get();
  const render = () => GT.render();
  const sync = () => GT.push.scheduleSync();
  const kcal = v => Math.round(v || 0).toLocaleString('fi-FI');
  const fmtAmt = v => String(v).replace('.', ',');

  /* ---------- Ruoan lisäys ---------- */
  function addEntries(date, meal, items, { toast = true } = {}) {
    const now = new Date().toISOString();
    Store.update(s => {
      items.forEach(it => s.food.entries.push({
        id: M.uid('f'), date, meal, name: it.name, amount: it.amount, unit: it.unit || 'g',
        kcal: Math.round(+it.kcal || 0), p: +it.p || 0, c: +it.c || 0, f: +it.f || 0,
        per100: it.per100 || null, createdAt: now
      }));
      L.autoCompleteMeal(s, date, meal);
    });
    ui.haptic(12);
    if (toast) ui.toast(items.length === 1 ? `${esc(items[0].name)} lisätty (${kcal(items[0].kcal)} kcal)` : `${items.length} ruokaa lisätty`);
    sync();
  }

  function itemFromResult(x) {
    // tietokanta-/viimeisin-/suosikkirivi → lisättävä ruoka oletusmäärällä
    return L.scaleItem(x, x.amount) || x;
  }

  function foodSheet(date, meal) {
    date = date || L.today();
    meal = meal || (date === L.today() ? L.defaultMeal() : 'm1');
    let q = '';
    let results = [];
    return ui.sheet(`<div class="food-sheet">
        <h3 class="sheet-title">Lisää ruoka</h3>
        <div class="segmented meal-pick">${L.MEALS.map(m => `<button type="button" class="${m.key === meal ? 'on' : ''}" data-meal="${m.key}">${m.label}</button>`).join('')}</div>
        <div class="search-wrap">${icon('search')}<input class="search" type="search" placeholder="Hae ruokaa tai suosikkia…" autocomplete="off" enterkeyhint="search"></div>
        <div class="barcode-row"><input class="code" inputmode="numeric" placeholder="Viivakoodi (numerot)" autocomplete="off"><button type="button" class="btn btn-soft" data-code>Hae</button></div>
        <div class="food-pane"></div>
        <div class="sheet-actions">
          <button type="button" class="btn btn-soft btn-block" data-x="custom">${icon('edit')} Oma ruoka (syötä arvot)</button>
          <button type="button" class="btn btn-ghost btn-block" data-sheet="done">Valmis</button>
        </div></div>`, {
      onMount(el, close) {
        const pane = el.querySelector('.food-pane');
        const input = el.querySelector('.search');
        let offRes = [], offLoading = false, offErr = false, offT = null, offSeq = 0;
        const row = (x, i, kind) => {
          const it = kind === 'fav' ? { name: x.name, ...L.totals(x.items) } : itemFromResult(x);
          const sub = kind === 'fav' ? `${x.items.length > 1 ? x.items.length + ' ruokaa · ' : ''}${kcal(it.kcal)} kcal · P ${F.num(it.p, 0)} g`
            : `${fmtAmt(it.amount)} ${esc(it.unit)} · ${kcal(it.kcal)} kcal · P ${F.num(it.p, 0)} g`;
          return `<li><button type="button" class="fr-main" data-pick="${kind}:${i}"><b>${esc(x.name)}</b><span class="muted sm">${sub}</span></button>
            <button type="button" class="icon-btn sm fr-add" data-quick="${kind}:${i}" aria-label="Lisää heti">${icon('plus')}</button></li>`;
        };
        function list() {
          results = L.searchFoods(S(), q);
          const sec = (title, arr, kind) => arr.length ? `<div class="fr-title">${title}</div><ul class="fr-list">${arr.map((x, i) => row(x, i, kind)).join('')}</ul>` : '';
          let off = '';
          if (offLoading) off = `<div class="fr-title">Open Food Facts</div><p class="muted sm">Haetaan verkosta…</p>`;
          else if (offErr) off = `<div class="fr-title">Open Food Facts</div><p class="muted sm">Verkkohaku ei onnistunut. Tarkista yhteys.</p>`;
          else if (offRes.length) off = sec('Open Food Facts', offRes, 'off') + `<p class="muted sm src">Tiedot: Open Food Facts (ODbL)</p>`;
          const html = sec('Suosikit', results.favs, 'fav') + sec(q ? 'Aiemmin syödyt' : 'Viimeksi lisätyt', results.recent, 'recent') + sec('Ruokatietokanta', results.db.slice(0, 30), 'db') + off;
          pane.innerHTML = html || `<p class="muted sm center">${q ? 'Ei osumia. Lisää ruoka omilla arvoilla alta.' : 'Hae ruokaa kirjoittamalla nimi, esim. "kana" tai "rahka".'}</p>`;
        }
        function get(ref) {
          const [kind, i] = ref.split(':');
          const arr = kind === 'fav' ? results.favs : kind === 'recent' ? results.recent : kind === 'off' ? offRes : results.db;
          return { kind, x: arr[+i] };
        }
        function amountView(x) {
          const base = itemFromResult(x);
          const chips = [];
          if (x.por) { chips.push([`1 ${x.por[0]}`, x.por[1]]); chips.push([`2 ${x.por[0]}`, x.por[1] * 2]); }
          else if (!x.per100) { chips.push(['½ ×', base.amount / 2], ['1 ×', base.amount], ['2 ×', base.amount * 2]); }
          if (x.per100) [50, 100, 150, 200, 300].forEach(v => chips.push([v + ' ' + (x.unit || 'g'), v]));
          pane.innerHTML = `<div class="amount-view">
            <div class="row-between"><b>${esc(x.name)}</b><button type="button" class="link sm" data-back="1">Takaisin</button></div>
            <label class="field"><span>Määrä (${esc(base.unit)})</span><input class="amt" inputmode="decimal" value="${fmtAmt(base.amount)}" autocomplete="off"></label>
            <div class="chips">${chips.map(([l, v]) => `<button type="button" class="chip" data-amt="${v}">${l}</button>`).join('')}</div>
            <div class="amt-preview"></div>
            <button type="button" class="btn btn-primary btn-block btn-lg" data-confirm="1">${icon('plus')} Lisää</button></div>`;
          const amt = pane.querySelector('.amt');
          const prev = () => {
            const it = L.scaleItem(x, amt.value);
            pane.querySelector('.amt-preview').innerHTML = it ? `<b>${kcal(it.kcal)} kcal</b><span>P ${F.num(it.p)} g · H ${F.num(it.c)} g · R ${F.num(it.f)} g</span>` : '<span class="muted">Syötä määrä</span>';
            return it;
          };
          prev();
          amt.addEventListener('input', prev);
          pane.querySelector('.chips').addEventListener('click', e => { const b = e.target.closest('[data-amt]'); if (b) { amt.value = fmtAmt(Math.round(+b.dataset.amt * 10) / 10); prev(); } });
          pane.querySelector('[data-back]').addEventListener('click', list);
          pane.querySelector('[data-confirm]').addEventListener('click', () => {
            const it = prev();
            if (!it) return ui.toast('Syötä määrä', 'error');
            addEntries(date, meal, [it]);
            q = ''; input.value = ''; list();
          });
          setTimeout(() => { amt.focus(); amt.select(); }, 50);
        }
        el.querySelector('.meal-pick').addEventListener('click', e => {
          const b = e.target.closest('[data-meal]'); if (!b) return;
          meal = b.dataset.meal;
          el.querySelectorAll('.meal-pick button').forEach(x => x.classList.toggle('on', x === b));
        });
        // Verkkohaku (Open Food Facts) käynnistyy, kun hakusanassa on vähintään 3 merkkiä. Viive estää turhat pyynnöt.
        function scheduleOff() {
          clearTimeout(offT);
          const mine = ++offSeq;
          if (q.trim().length < 3) { offRes = []; offLoading = false; offErr = false; return; }
          offLoading = true; offErr = false;
          offT = setTimeout(async () => {
            try {
              const r = await GT.OFF.search(q);
              if (mine !== offSeq) return;
              offRes = r; offErr = false;
            } catch (err) {
              if (mine !== offSeq) return;
              offRes = []; offErr = true;
            }
            offLoading = false; list();
          }, 450);
        }
        input.addEventListener('input', () => { q = input.value; scheduleOff(); list(); });
        el.querySelector('[data-code]').addEventListener('click', async () => {
          const code = el.querySelector('.code').value;
          try {
            const it = await GT.OFF.byCode(code);
            if (!it) return ui.toast('Tuotetta ei löytynyt tällä viivakoodilla', 'error');
            amountView(it);
          } catch (err) { ui.toast('Verkkohaku ei onnistunut', 'error'); }
        });
        pane.addEventListener('click', e => {
          const quick = e.target.closest('[data-quick]');
          const pick = e.target.closest('[data-pick]');
          if (quick) {
            const { kind, x } = get(quick.dataset.quick);
            if (kind === 'fav') { addFavorite(x, date, meal); }
            else addEntries(date, meal, [itemFromResult(x)]);
            quick.classList.add('added'); GT.motion.pop(quick);
            return;
          }
          if (pick) {
            const { kind, x } = get(pick.dataset.pick);
            if (kind === 'fav') { addFavorite(x, date, meal); return; }
            amountView(x);
          }
        });
        el.querySelector('[data-x="custom"]').addEventListener('click', () => { close('custom'); });
        list();
      }
    }).then(r => {
      if (r === 'custom') return customFood(date, meal);
      render();
    });
  }

  async function customFood(date, meal, existing) {
    const e = existing || {};
    const v = await ui.form({
      title: existing ? 'Muokkaa ruokaa' : 'Oma ruoka', ok: existing ? 'Tallenna' : 'Lisää',
      fields: [
        { name: 'name', label: 'Ruoan nimi', value: e.name || '', required: true, placeholder: 'esim. Kanasalaatti' },
        { name: 'amount', label: 'Määrä', type: 'number', value: e.amount != null ? fmtAmt(e.amount) : '', required: true, half: true, placeholder: '100' },
        { name: 'unit', label: 'Yksikkö', value: e.unit || 'g', half: true },
        { name: 'kcal', label: 'Kalorit (kcal)', type: 'number', value: e.kcal != null ? e.kcal : '', required: true, half: true },
        { name: 'p', label: 'Proteiini (g)', type: 'number', value: e.p != null ? fmtAmt(e.p) : '', half: true },
        { name: 'c', label: 'Hiilihydraatit (g)', type: 'number', value: e.c != null ? fmtAmt(e.c) : '', half: true },
        { name: 'f', label: 'Rasva (g)', type: 'number', value: e.f != null ? fmtAmt(e.f) : '', half: true },
        ...(existing ? [] : [{ name: 'fav', label: 'Tallenna myös suosikiksi', type: 'checkbox' }])
      ],
      extra: existing ? '' : '<p class="muted sm">Arvot syötetään koko annokselle. Löydät ne pakkauksesta (per 100 g × määrä / 100).</p>'
    });
    if (!v || v.__action) return render();
    const item = { name: v.name, amount: v.amount, unit: v.unit || 'g', kcal: v.kcal || 0, p: v.p || 0, c: v.c || 0, f: v.f || 0 };
    if (existing) {
      Store.update(() => Object.assign(existing, item, { per100: null }));
      ui.toast('Ruoka päivitetty'); sync();
    } else {
      addEntries(date, meal, [item]);
      if (v.fav) saveFavorite(item.name, [item]);
    }
    render();
  }

  function saveFavorite(name, items) {
    const clean = items.map(i => ({ name: i.name, amount: i.amount, unit: i.unit || 'g', kcal: i.kcal, p: i.p, c: i.c, f: i.f, per100: i.per100 || null }));
    Store.update(s => s.food.favorites.push({ id: M.uid('fav'), name, items: clean, uses: 0, createdAt: new Date().toISOString() }));
    ui.toast(`Tallennettu suosikiksi: ${esc(name)}`);
  }

  function addFavorite(fav, date, meal) {
    date = date || L.today();
    meal = meal || (date === L.today() ? L.defaultMeal() : 'm1');
    addEntries(date, meal, fav.items, { toast: false });
    Store.update(s => { const f = s.food.favorites.find(x => x.id === fav.id); if (f) f.uses = (f.uses || 0) + 1; });
    ui.toast(`${esc(fav.name)} lisätty: ${L.mealLabel(meal)} (${kcal(L.totals(fav.items).kcal)} kcal)`);
  }

  // Muistutuksen 'meal'-tieto lomakkeelta: oletuksena ei mitään
  /* ---------- Muistutuslomake ---------- */
  function reminderSheet(existing) {
    const r = existing || { id: null, time: L.hm(new Date(Date.now() + 3600000)).slice(0, 3) + '00', title: '', body: '', days: [], enabled: true, notify: true };
    let days = r.days && r.days.length ? r.days.slice() : [0, 1, 2, 3, 4, 5, 6];
    return ui.sheet(`<form class="sheet-form rem-form" novalidate>
      <h3 class="sheet-title">${existing ? 'Muokkaa muistutusta' : 'Uusi muistutus'}</h3>
      <div class="fields">
        <label class="field half"><span>Kellonaika</span><input type="time" name="time" value="${r.time}" required></label>
        <label class="field half"><span>Otsikko</span><input name="title" value="${esc(r.title)}" placeholder="esim. Vettä" autocomplete="off" required></label>
        <label class="field"><span>Ilmoituksen teksti</span><input name="body" value="${esc(r.body || '')}" placeholder="Valinnainen" autocomplete="off"></label>
      </div>
      <div class="card-label mt-sm">Päivät</div>
      <div class="day-pick">${['ma', 'ti', 'ke', 'to', 'pe', 'la', 'su'].map((d, i) => `<button type="button" class="${days.includes(i) ? 'on' : ''}" data-d="${i}">${d}</button>`).join('')}</div>
      <label class="toggle"><span>Lähetä puhelimen ilmoitus</span><input type="checkbox" name="notify" ${r.notify !== false ? 'checked' : ''}><i></i></label>
      <div class="sheet-actions">
        <button class="btn btn-primary btn-block" type="submit">Tallenna</button>
        ${existing ? `<button type="button" class="btn btn-danger-ghost btn-block" data-sheet="delete">${icon('trash')} Poista muistutus</button>` : ''}
        <button type="button" class="btn btn-ghost btn-block" data-sheet="cancel">Peruuta</button>
      </div></form>`, {
      onMount(el, close) {
        const form = el.querySelector('form');
        el.querySelector('.day-pick').addEventListener('click', e => {
          const b = e.target.closest('[data-d]'); if (!b) return;
          const d = +b.dataset.d;
          days = days.includes(d) ? days.filter(x => x !== d) : days.concat(d).sort();
          b.classList.toggle('on', days.includes(d));
        });
        form.addEventListener('submit', e => {
          e.preventDefault();
          const time = form.elements.time.value, title = form.elements.title.value.trim();
          if (!/^\d{2}:\d{2}$/.test(time) || !title) { ui.toast('Anna kellonaika ja otsikko', 'error'); return; }
          if (!days.length) { ui.toast('Valitse vähintään yksi päivä', 'error'); return; }
          const out = { time, title, body: form.elements.body.value.trim(), days: days.length === 7 ? [] : days, notify: form.elements.notify.checked };
          close({ save: out });
        });
      }
    });
  }

  /* ---------- Tehtävä/muistutus-paneeli (myös ilmoituksesta avattaessa) ---------- */
  async function taskMenu(rid, fromNotification) {
    const st = S();
    const r = st.reminders.find(x => x.id === rid);
    if (!r) return;
    const t = L.today();
    const done = !!(st.tasks.done[t] || {})[rid];
    const res = await ui.sheet(`<div class="sheet-ic">${icon('bell')}</div>
      <h3 class="sheet-title">${esc(r.title)}</h3>
      <p class="sheet-text">${r.time.replace(':', '.')}${r.body ? ' · ' + esc(r.body) : ''}</p>
      <div class="sheet-actions">
        ${r.kind === 'meal' && !done ? `<button class="btn btn-primary btn-block" data-sheet="food">${icon('plus')} Kirjaa ateria</button>` : ''}
        ${r.kind === 'summary' ? `<button class="btn btn-soft btn-block" data-sheet="foodview">Avaa päivän ruokailut</button>` : ''}
        ${r.kind === 'report' ? `<button class="btn btn-soft btn-block" data-sheet="report">Avaa viikkoraportti</button>` : ''}
        <button class="btn ${done ? 'btn-soft' : r.kind === 'meal' ? 'btn-soft' : 'btn-primary'} btn-block" data-sheet="toggle">${done ? 'Merkitse tekemättömäksi' : icon('check') + ' Merkitse tehdyksi'}</button>
        ${done ? '' : `<div class="snooze-row"><span class="muted sm">Torkuta</span>
          <button class="chip" data-sheet="snz:10">10 min</button><button class="chip" data-sheet="snz:30">30 min</button><button class="chip" data-sheet="snz:60">1 h</button></div>`}
        <button class="btn btn-ghost btn-block" data-sheet="${fromNotification ? 'cancel' : 'edit'}">${fromNotification ? 'Sulje' : icon('edit') + ' Muokkaa muistutusta'}</button>
      </div>`);
    if (!res || res === 'cancel') return;
    if (res === 'toggle') {
      Store.update(s => L.setDone(s, rid, t, !done));
      if (!done) { ui.haptic(15); ui.toast(`${esc(r.title)} tehty`); }
      sync(); render();
      const tp = L.taskProgress(S(), t);
      if (!done && tp.total && tp.done === tp.total) GT.motion.celebrate();
    }
    else if (res.startsWith('snz:')) {
      const min = +res.slice(4);
      try {
        const until = await GT.push.snooze(r, min);
        ui.toast(`Torkutettu klo ${L.hm(new Date(until)).replace(':', '.')} asti${S().push.subscribed ? '' : ' (vain sovellus auki)'}`);
      } catch (e) { ui.toast('Torkku tallennettiin vain laitteelle: ' + esc(e.message), 'error', 4000); }
      render();
    }
    else if (res === 'food') { foodSheet(t, r.meal); }
    else if (res === 'foodview') GT.go('food');
    else if (res === 'report') GT.go('report');
    else if (res === 'edit') editReminder(rid);
  }

  async function editReminder(rid) {
    const r = rid ? S().reminders.find(x => x.id === rid) : null;
    const res = await reminderSheet(r);
    if (!res || res === 'cancel') return;
    if (res === 'delete') {
      const ok = await ui.confirm({ title: `Poistetaanko ${esc(r.title)}?`, ok: 'Poista', danger: true });
      if (!ok) return;
      Store.update(s => { s.reminders = s.reminders.filter(x => x.id !== rid); });
      ui.toast('Muistutus poistettu');
    } else if (res.save) {
      Store.update(s => {
        if (r) Object.assign(r, res.save);
        else s.reminders.push({ id: M.uid('r'), enabled: true, ...res.save });
      });
      ui.toast(r ? 'Muistutus tallennettu' : 'Muistutus lisätty');
    }
    sync(); render();
  }

  /* ---------- Toiminnot ---------- */
  GT.extraActions = {
    'task-toggle': el => {
      const t = L.today(), id = el.dataset.id;
      const was = !!(S().tasks.done[t] || {})[id];
      Store.update(s => L.setDone(s, id, t, !was));
      if (!was) ui.haptic(15);
      sync(); render();
      const btn = document.querySelector(`.task-check[data-id="${id}"]`);
      if (btn) GT.motion.pop(btn.closest('li'));
      const tp = L.taskProgress(S(), t);
      if (!was && tp.total && tp.done === tp.total) {
        const r = btn ? btn.getBoundingClientRect() : null;
        GT.motion.celebrate(r ? r.left + 15 : null, r ? r.top + 15 : null);
        ui.toast('Kaikki päivän tehtävät tehty! Hienoa!', '', 3200);
      }
    },
    'task-menu': el => taskMenu(el.dataset.id),
    'food-menu': el => ui.menu(el, [
      { label: 'Tavoitteet', icon: 'flag', action: 'food-goals' },
      { label: 'Suosikit', icon: 'trophy', href: '#/food-favs' },
      { label: 'Viikkoraportti', icon: 'note', href: '#/food-report/week' },
      { label: 'Kuukausiraportti', icon: 'chart', href: '#/food-report/month' }
    ]),
    'rem-menu': el => ui.menu(el, [
      { label: 'Uusi muistutus', icon: 'plus', action: 'rem-new' },
      { label: 'Palauta oletukset', icon: 'swap', action: 'rem-reset' }
    ]),
    'food-add': el => foodSheet(el.dataset.date, el.dataset.meal),
    'fav-add': el => { const f = S().food.favorites.find(x => x.id === el.dataset.id); if (f) { addFavorite(f, el.dataset.date); render(); } },
    'fav-delete': async el => {
      const f = S().food.favorites.find(x => x.id === el.dataset.id);
      if (!f || !(await ui.confirm({ title: `Poistetaanko suosikki ${esc(f.name)}?`, ok: 'Poista', danger: true }))) return;
      Store.update(s => { s.food.favorites = s.food.favorites.filter(x => x.id !== f.id); });
      render();
    },
    'food-entry': async el => {
      const e = S().food.entries.find(x => x.id === el.dataset.id);
      if (!e) return;
      const r = await ui.sheet(`<h3 class="sheet-title">${esc(e.name)}</h3><p class="sheet-text">${fmtAmt(e.amount)} ${esc(e.unit)} · ${kcal(e.kcal)} kcal · P ${F.num(e.p)} g · H ${F.num(e.c)} g · R ${F.num(e.f)} g</p>
        <div class="sheet-actions">
          <button class="btn btn-soft btn-block" data-sheet="amount">Muuta määrää</button>
          <div class="snooze-row"><span class="muted sm">Siirrä</span>${L.MEALS.filter(m => m.key !== e.meal).map(m => `<button class="chip" data-sheet="move:${m.key}">${m.label}</button>`).join('')}</div>
          <button class="btn btn-soft btn-block" data-sheet="fav">${icon('trophy')} Tallenna suosikiksi</button>
          <button class="btn btn-soft btn-block" data-sheet="edit">${icon('edit')} Muokkaa tietoja</button>
          <button class="btn btn-danger-ghost btn-block" data-sheet="delete">${icon('trash')} Poista</button>
          <button class="btn btn-ghost btn-block" data-sheet="cancel">Peruuta</button></div>`);
      if (r === 'amount') {
        const v = await ui.form({ title: 'Muuta määrää', fields: [{ name: 'amount', label: `Määrä (${e.unit})`, type: 'number', value: fmtAmt(e.amount), required: true }] });
        if (v && !v.__action) { const it = L.scaleItem(e, v.amount); if (it) { Store.update(() => Object.assign(e, it)); sync(); } }
      } else if (r && r.startsWith('move:')) { Store.update(s => { e.meal = r.slice(5); L.autoCompleteMeal(s, e.date, e.meal); }); sync(); }
      else if (r === 'fav') saveFavorite(e.name, [e]);
      else if (r === 'edit') return customFood(e.date, e.meal, e);
      else if (r === 'delete') { Store.update(s => { s.food.entries = s.food.entries.filter(x => x.id !== e.id); }); ui.toast('Poistettu'); sync(); }
      render();
    },
    'meal-menu': async el => {
      const { meal, date } = el.dataset;
      const list = L.entriesOn(S(), date).filter(e => e.meal === meal);
      const r = await ui.sheet(`<h3 class="sheet-title">${L.mealLabel(meal)}</h3><p class="sheet-text">${list.length} ruokaa · ${kcal(L.totals(list).kcal)} kcal</p>
        <div class="sheet-actions">
          <button class="btn btn-primary btn-block" data-sheet="fav">${icon('trophy')} Tallenna koko ateria suosikiksi</button>
          <button class="btn btn-danger-ghost btn-block" data-sheet="clear">${icon('trash')} Tyhjennä ateria</button>
          <button class="btn btn-ghost btn-block" data-sheet="cancel">Peruuta</button></div>`);
      if (r === 'fav') {
        const v = await ui.form({ title: 'Suosikkiaterian nimi', fields: [{ name: 'name', label: 'Nimi', value: list.map(x => x.name).slice(0, 2).join(' + '), required: true }] });
        if (v && !v.__action) saveFavorite(v.name, list);
      } else if (r === 'clear') {
        if (await ui.confirm({ title: 'Tyhjennetäänkö ateria?', ok: 'Tyhjennä', danger: true })) {
          const ids = new Set(list.map(x => x.id));
          Store.update(s => { s.food.entries = s.food.entries.filter(x => !ids.has(x.id)); });
          sync();
        }
      }
      render();
    },
    'meal-copy': el => {
      const { meal, from, date } = el.dataset;
      const list = L.entriesOn(S(), from).filter(e => e.meal === meal);
      addEntries(date, meal, list, { toast: false });
      ui.toast(`${L.mealLabel(meal)} kopioitu (${kcal(L.totals(list).kcal)} kcal)`);
      render();
    },
    'food-goals': async () => {
      const gl = S().food.goals;
      const v = await ui.form({ title: 'Päivän tavoitteet', fields: [
        { name: 'kcal', label: 'Kalorit (kcal)', type: 'number', int: true, value: gl.kcal, required: true, half: true },
        { name: 'protein', label: 'Proteiini (g)', type: 'number', int: true, value: gl.protein, required: true, half: true },
        { name: 'carbs', label: 'Hiilihydraatit (g)', type: 'number', int: true, value: gl.carbs, half: true },
        { name: 'fat', label: 'Rasva (g)', type: 'number', int: true, value: gl.fat, half: true },
        { name: 'weight', label: 'Tavoitepaino (kg, valinnainen)', type: 'number', value: gl.weight != null ? fmtAmt(gl.weight) : '' }
      ], extra: '<p class="muted sm">Suuntaa-antava proteiinitavoite lihasmassan kasvatukseen on noin 1,6–2,2 g painokiloa kohden.</p>' });
      if (!v || v.__action) return;
      Store.update(s => { Object.assign(s.food.goals, { kcal: Math.round(v.kcal), protein: Math.round(v.protein), carbs: Math.round(v.carbs || 0), fat: Math.round(v.fat || 0), weight: v.weight }); });
      ui.toast('Tavoitteet tallennettu'); sync(); render();
    },
    'report-shift': el => { VS.foodReportOffset = Math.min(0, VS.foodReportOffset + (+el.dataset.v)); render(); },

    'trip-start': async el => {
      const t = L.today();
      const start = L.addDays(t, +(el.dataset.offset || 0));
      const v = await ui.form({ title: 'Olen töissä', ok: 'Ota käyttöön', fields: [
        { name: 'from', label: 'Alkaa', type: 'date', value: start, required: true, half: true },
        { name: 'to', label: 'Päättyy', type: 'date', value: L.addDays(start, 6), required: true, half: true }],
        extra: '<p class="muted sm">Työpäivinä ateriamuistutukset kertovat työpäivän ohjeen. Muut muistutukset ja tehtävät säilyvät ennallaan.</p>' });
      if (!v || v.__action) return;
      if (!v.from || !v.to || v.to < v.from) return ui.toast('Tarkista päivämäärät', 'error');
      Store.update(s => { s.trip = { from: v.from, to: v.to }; });
      ui.toast('Merkitty töihin. Hyvää työpäivää!');
      sync(); render();
    },
    'trip-end': async () => {
      if (!(await ui.confirm({ title: 'Lopetetaanko työjakso?', text: 'Muistutukset palaavat normaaliin ohjeeseen.', ok: 'Lopeta' }))) return;
      Store.update(s => { s.trip = null; });
      ui.toast('Työjakso lopetettu');
      sync(); render();
    },
    'rem-new': () => editReminder(null),
    'rem-edit': el => editReminder(el.dataset.id),
    'rem-reset': async () => {
      if (!(await ui.confirm({ title: 'Palautetaanko oletusmuistutukset?', text: 'Omat muutokset ja lisätyt muistutukset korvataan oletuksilla (9.00, 12.00, 15.30, 19.30, 20.00, 21.00 ja sunnuntain viikkoraportti).', ok: 'Palauta' }))) return;
      Store.update(s => { s.reminders = L.defaultReminders(); });
      sync(); render();
    },

    'push-enable': async el => {
      el.disabled = true;
      try {
        await GT.push.enable();
        ui.toast('Ilmoitukset käytössä');
        try { await GT.push.test(0); } catch (e) { /* testi ei pakollinen */ }
      } catch (e) {
        Store.update(s => { s.push.lastError = e.message; });
        ui.toast(esc(e.message), 'error', 5000);
      }
      VS.pushStatus = null; render();
    },
    'push-disable': async () => {
      if (!(await ui.confirm({ title: 'Poistetaanko ilmoitukset käytöstä?', text: 'Muistutukset eivät enää tule tähän puhelimeen.', ok: 'Poista käytöstä', danger: true }))) return;
      await GT.push.disable(); VS.pushStatus = null; render();
    },
    'push-test': async el => {
      const d = +el.dataset.v;
      try {
        const r = await GT.push.test(d);
        if (d) ui.toast('Testi ajastettu. Sulje sovellus nyt kokonaan.', '', 4000);
        else ui.toast(r.ok ? 'Testi lähetetty' : 'Lähetys epäonnistui: ' + esc((r.results || []).map(x => x.status + ' ' + (x.error || '')).join(', ')), r.ok ? '' : 'error', 5000);
      } catch (e) { ui.toast(esc(e.message), 'error', 5000); }
    },
    'push-status': async () => {
      try { VS.serverStatus = await GT.push.serverStatus(); } catch (e) { ui.toast(esc(e.message), 'error'); }
      render();
    }
  };

  GT.extraBinds = {
    'rem-enabled': el => { Store.update(s => { const r = s.reminders.find(x => x.id === el.dataset.id); if (r) r.enabled = el.checked; }); sync(); render(); },
    'push-server': el => { Store.update(s => { s.push.server = el.value.trim(); }); VS.pushStatus = null; GT.push.writeSwConfig(); }
  };
  GT.extraChangeBinds = ['rem-enabled'];

  /* ---------- Ilmoituksesta avaaminen ---------- */
  GT.openReminder = rid => setTimeout(() => taskMenu(rid, true), 250);

  /* ---------- Varajärjestelmä sovelluksen ollessa auki ----------
   * Jos push-ilmoitukset eivät ole käytössä, muistutus näytetään sovelluksen
   * sisällä, kun sovellus on auki. Varsinainen toimitus tapahtuu palvelimelta. */
  const shown = new Set();
  function checkInApp() {
    const st = S();
    if (st.push && st.push.subscribed && 'Notification' in window && Notification.permission === 'granted') return;
    const now = new Date(), t = L.today(), hmNow = L.hm(now);
    const done = st.tasks.done[t] || {};
    st.reminders.forEach(r => {
      if (r.notify === false || !L.activeOn(r, t) || done[r.id] || r.time !== hmNow) return;
      const k = r.id + '|' + t + '|' + hmNow;
      if (shown.has(k)) return;
      shown.add(k);
      ui.toast(`${icon('bell')} <b>${esc(r.title)}</b>`, '', 5000);
      taskMenu(r.id, true);
    });
    Object.entries(st.snoozed || {}).forEach(([rid, until]) => {
      if (until <= Date.now() && !done[rid]) {
        Store.update(s => { delete s.snoozed[rid]; });
        taskMenu(rid, true);
      }
    });
  }
  setInterval(checkInApp, 15000);
})();

</script>
<script>/* js/app.js */
/* GymTrack – sovelluslogiikka: reititys, toiminnot, lepoajastin */
(function () {
  'use strict';

  const Store = GT.Store, M = GT.model, F = GT.fmt, ui = GT.ui, V = GT.views, VS = GT.viewState;
  const S = () => Store.get();
  const viewEl = document.getElementById('view');

  Store.init(M.createDefault);
  if (M.ensurePlan(S())) Store.update();
  // Elämäntapaosat (ruoka, muistutukset, tehtävät) lisätään vanhaan tallennukseen
  if (GT.life.ensureLife(S())) Store.update();
  Store.onChange(st => { GT.life.ensureLife(st); GT.push.scheduleSync(); });

  /* ================= REITITYS ================= */
  const routes = [
    [/^$|^today(?:\?.*)?$/, () => V.today(), 'today'],
    [/^food$/, () => V.food(), 'food'],
    [/^food\/(\d{4}-\d{2}-\d{2})$/, m => V.food(m[1]), 'food'],
    [/^food-report\/(week|month)$/, m => V.foodReport(m[1]), 'food'],
    [/^food-favs$/, () => V.foodFavs(), 'food'],
    [/^reminders$/, () => V.reminders(), 'reminders'],
    [/^notifications$/, () => V.notifications(), 'reminders'],
    [/^report(?:\/(.+))?$/, m => V.report(m[1]), 'today'],
    [/^home$/, () => V.home(), 'gym'],
    [/^workouts$/, () => V.workouts(), 'gym'],
    [/^workout\/(.+)$/, m => V.workout(m[1]), 'gym'],
    [/^edit\/(.+)$/, m => V.edit(m[1]), 'gym'],
    [/^session$/, () => V.session(), 'gym'],
    [/^session\/(\d+)$/, m => V.sessionEx(m[1]), 'gym'],
    [/^summary\/(.+)$/, m => V.summary(m[1]), 'gym'],
    [/^history$/, () => V.history(), 'gym'],
    [/^history\/(.+)$/, m => V.historyDetail(m[1]), 'gym'],
    [/^progress$/, () => V.progress(), 'body'],
    [/^progress\/(.+)$/, m => V.progressDetail(m[1]), 'body'],
    [/^prs$/, () => V.prs(), 'body'],
    [/^body$/, () => V.body(), 'body'],
    [/^body\/(.+)$/, m => V.bodyDetail(m[1]), 'body'],
    [/^settings$/, () => V.settings(), 'today']
  ];

  let lastRoute = null;
  // Upotetussa näkymässä (esim. Claude-artifakti) reititys pidetään muistissa.
  let memPath = GT.EMBEDDED ? 'home' : null; // inside Terra it opens straight on the workout page
  function currentPath() { return memPath !== null ? memPath : location.hash.replace(/^#\/?/, ''); }

  function render() {
    let path = currentPath();
    // Ilmoituksesta avattu: #/today?r=<muistutus>
    const deep = path.match(/^today\?(?:.*&)?r=([^&]+)/);
    if (deep) {
      path = 'today';
      if (memPath !== null) memPath = 'today'; else history.replaceState(null, '', '#/today');
      GT.openReminder(decodeURIComponent(deep[1]));
    }
    let html = null, tab = 'home';
    for (const [re, fn, t] of routes) {
      const m = path.match(re);
      if (m) { html = fn(m); tab = t; break; }
    }
    if (html === null) html = V.notFound();
    const changed = path !== lastRoute;
    if (changed || !viewEl.firstChild) {
      viewEl.innerHTML = html;
      viewEl.classList.remove('enter'); void viewEl.offsetWidth; viewEl.classList.add('enter');
      window.scrollTo(0, 0);
      GT.motion.countUp(viewEl);
    } else {
      // Sama näkymä: päivitetään paikallaan, jolloin siirtymät animoituvat eikä näkymä välähdä
      GT.motion.morph(viewEl, html);
    }
    lastRoute = path;
    document.querySelectorAll('.nav a').forEach(a => a.classList.toggle('on', a.dataset.tab === tab));
    document.body.classList.toggle('in-session', path.startsWith('session'));
    GT.charts.bind(viewEl);
    renderRest();
  }
  GT.render = render;
  window.addEventListener('hashchange', render);

  const go = path => {
    if (memPath !== null) { memPath = path; render(); return; }
    if (currentPath() === path) render(); else location.hash = '#/' + path;
  };
  GT.go = go;
  if (memPath !== null) {
    document.addEventListener('click', e => {
      const a = e.target.closest('a[href^="#/"]');
      if (!a) return;
      e.preventDefault();
      go(a.getAttribute('href').slice(2));
    });
  }

  /* ================= TREENISESSIO ================= */
  function lastVariant(st, exerciseId) {
    for (const s of M.finishedSessions(st)) {
      const e = s.exercises.find(x => x.exerciseId === exerciseId && x.variant);
      if (e) return e.variant;
    }
    return null;
  }

  function startWorkout(w) {
    const st = S();
    const sess = {
      id: M.uid('s'),
      workoutId: w.id,
      workoutName: w.name,
      startedAt: new Date().toISOString(),
      endedAt: null,
      notes: '',
      prs: [],
      exercises: w.exercises.map(e => {
        let variant;
        if (e.variants && e.variants.length) {
          // vaihtoehdot vuorottelevat oletuksena treenikerrasta toiseen
          const lv = lastVariant(st, e.id);
          const i = e.variants.indexOf(lv);
          variant = i === -1 ? e.variants[0] : e.variants[(i + 1) % e.variants.length];
        }
        return {
          exerciseId: e.id, name: e.name,
          variants: e.variants && e.variants.length ? e.variants.slice() : undefined,
          variant,
          target: { sets: e.sets, repMin: e.repMin, repMax: e.repMax },
          sets: Array.from({ length: e.sets }, () => ({ weight: '', reps: '', done: false }))
        };
      })
    };
    Store.update(s => { s.sessions.push(sess); s.activeSessionId = sess.id; });
    go('session');
  }

  /** Laskee treenin ennätykset vertaamalla sitä aiempiin treeneihin. */
  function computeSessionPRs(st, sess) {
    const out = [];
    sess.exercises.forEach(e => {
      const key = M.exKey(e);
      const prior = M.exerciseHistory(st, key, sess.id).filter(h => h.session.startedAt < sess.startedAt);
      if (!prior.length) return;
      const base = M.computePRs(prior);
      let best = null;
      const rank = { weight: 3, e1rm: 2, reps: 1 };
      e.sets.filter(M.setLogged).forEach(s => {
        const w = M.num(s.weight) || 0, r = M.num(s.reps) || 0;
        const est = M.e1rm(w, r);
        let c = null;
        if (base.maxWeight && w > base.maxWeight.weight) c = { type: 'weight', text: `Suurin paino ${F.kg(w)} × ${r}`, v: w };
        else if (est && base.bestE1rm && est > base.bestE1rm.value) c = { type: 'e1rm', text: `Arvioitu 1RM ${F.kg(est)} (${F.num(w)} × ${r})`, v: est };
        else if (base.repsAtWeight[String(w)] && r > base.repsAtWeight[String(w)].reps) c = { type: 'reps', text: `${r} toistoa painolla ${F.kg(w)}`, v: r };
        if (c && (!best || rank[c.type] > rank[best.type] || (c.type === best.type && c.v > best.v))) best = c;
      });
      if (best) out.push({ key, label: M.exLabel(e), type: best.type, text: best.text });
    });
    return out;
  }

  async function finishSession() {
    const st = S();
    const a = M.activeSession(st);
    if (!a) return;
    // kirjatut mutta merkitsemättömät sarjat lasketaan tehdyiksi
    const pending = a.exercises.reduce((n, e) => n + e.sets.filter(s => !s.done && M.num(s.reps) > 0).length, 0);
    const logged = a.exercises.reduce((n, e) => n + e.sets.filter(s => s.done || M.num(s.reps) > 0).length, 0);
    if (!logged) {
      const ok = await ui.confirm({ title: 'Ei kirjattuja sarjoja', text: 'Treenissä ei ole yhtään kirjattua sarjaa. Hylätäänkö treeni?', ok: 'Hylkää treeni', danger: true });
      if (ok) discardSession(true);
      return;
    }
    const ok = await ui.confirm({ title: 'Lopetetaanko treeni?', text: pending ? `${pending} kirjattua sarjaa merkitään tehdyiksi.` : 'Treeni tallennetaan treenipäiväkirjaan.', ok: 'Lopeta ja tallenna' });
    if (!ok) return;
    Store.update(s => {
      const sess = s.sessions.find(x => x.id === a.id);
      sess.exercises.forEach(e => {
        e.sets.forEach(x => { if (M.num(x.reps) > 0) x.done = true; });
        e.sets = e.sets.filter(M.setLogged);
      });
      sess.exercises = sess.exercises.filter(e => e.sets.length);
      sess.endedAt = new Date().toISOString();
      sess.prs = computeSessionPRs(s, sess);
      s.activeSessionId = null;
      s.rest = null;
    });
    Store.saveNow();
    go('summary/' + a.id);
  }

  async function discardSession(skipConfirm) {
    const a = M.activeSession(S());
    if (!a) return;
    if (!skipConfirm) {
      const ok = await ui.confirm({ title: 'Hylätäänkö treeni?', text: 'Tämän treenin kirjaukset poistetaan pysyvästi.', ok: 'Hylkää', danger: true });
      if (!ok) return;
    }
    Store.update(s => { s.sessions = s.sessions.filter(x => x.id !== a.id); s.activeSessionId = null; s.rest = null; });
    go('home');
  }

  /* ================= LEPOAJASTIN ================= */
  let audioCtx = null;
  document.addEventListener('pointerdown', () => {
    if (!audioCtx) { try { audioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { /* */ } }
    else if (audioCtx.state === 'suspended') audioCtx.resume();
  }, { passive: true });

  function beep() {
    if (!audioCtx || !S().settings.sound) return;
    const t = audioCtx.currentTime;
    [0, 0.22, 0.44].forEach((d, i) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.type = 'sine'; o.frequency.value = i === 2 ? 1175 : 880;
      g.gain.setValueAtTime(0.0001, t + d);
      g.gain.exponentialRampToValueAtTime(0.25, t + d + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t + d + 0.18);
      o.connect(g).connect(audioCtx.destination);
      o.start(t + d); o.stop(t + d + 0.2);
    });
  }

  function startRest(seconds) {
    seconds = seconds || S().settings.restSeconds || 90;
    Store.update(s => { s.rest = { endsAt: Date.now() + seconds * 1000, total: seconds }; });
    renderRest();
  }
  function stopRest() { Store.update(s => { s.rest = null; }); renderRest(); }

  const restEl = document.getElementById('rest');
  function renderRest() {
    const r = S().rest;
    if (!r) { restEl.hidden = true; restEl.innerHTML = ''; return; }
    const left = r.endsAt - Date.now();
    if (left <= 0) {
      stopRest();
      beep(); ui.haptic([200, 100, 200]);
      ui.toast('Lepo päättyi – seuraava sarja', '', 2400);
      return;
    }
    const pct = Math.max(0, Math.min(100, left / (r.total * 1000) * 100));
    if (restEl.hidden || !restEl.firstChild) {
      restEl.innerHTML = `<div class="rest-bar"><i></i></div>
        <div class="rest-inner">
          <button class="rest-btn" data-action="rest-adj" data-v="-15" aria-label="Vähennä 15 s">−15</button>
          <div class="rest-time"><span class="muted sm">Lepo</span><b></b></div>
          <button class="rest-btn" data-action="rest-adj" data-v="15" aria-label="Lisää 15 s">+15</button>
          <button class="rest-btn close" data-action="rest-stop" aria-label="Lopeta lepo">${ui.icon('x')}</button>
        </div>`;
      restEl.hidden = false;
    }
    restEl.querySelector('.rest-time b').textContent = F.clock(left + 999);
    restEl.querySelector('.rest-bar i').style.width = pct + '%';
  }

  setInterval(() => {
    if (S().rest) renderRest();
    document.querySelectorAll('[data-elapsed]').forEach(el => { el.textContent = F.clock(Date.now() - new Date(el.dataset.elapsed)); });
  }, 500);

  /* ================= TOIMINNOT ================= */
  const findWorkout = id => S().workouts.find(w => w.id === id);
  const activeEx = idx => { const a = M.activeSession(S()); return a ? a.exercises[+idx] : null; };

  function exerciseFields(e = {}, st, currentW) {
    const fields = [
