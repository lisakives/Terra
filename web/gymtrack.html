<!DOCTYPE html>
<html lang="fi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>GymTrack</title>
  <meta name="description" content="Henkilökohtainen kuntosalipäiväkirja, ruokaseuranta ja muistutukset">
  <meta name="theme-color" content="#0a0b0d">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="GymTrack">
  <meta name="format-detection" content="telephone=no">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800&family=Inter:wght@400;500;600;700&display=swap">
  <style>
/* GymTrack – tyylit */
:root {
  --bg: #0a0b0d;
  --surface: #141619;
  --surface-2: #1b1e22;
  --surface-3: #23272c;
  --border: rgba(255, 255, 255, 0.06);
  --border-strong: rgba(255, 255, 255, 0.11);
  --text: #eef1f4;
  --muted: #858c96;
  --faint: #545a63;
  --accent: #e5393b;
  --accent-strong: #ff6a64;
  --accent-soft: rgba(229, 57, 59, 0.11);
  --accent-ink: #ffffff;
  --good: #82d1ae;
  --bad: #ee938c;
  --radius: 20px;
  --radius-sm: 14px;
  --shadow: 0 1px 0 rgba(255, 255, 255, 0.03) inset, 0 10px 30px -18px rgba(0, 0, 0, 0.8);
  --nav-h: 64px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  --ease: cubic-bezier(.2, .8, .2, 1);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --font-display: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Inter", "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html { background: var(--bg); }
body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  background: var(--bg);
  color: var(--text);
  font: 400 16px/1.45 var(--font);
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
  overscroll-behavior-y: none;
  font-variant-numeric: tabular-nums;
}
a { color: inherit; text-decoration: none; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
button:disabled { opacity: .35; cursor: default; }
h1, h2, h3 { margin: 0; font-family: var(--font-display); letter-spacing: -0.02em; }
b { font-weight: 600; }

.ic { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.ic.inline { width: 15px; height: 15px; vertical-align: -2px; margin-right: 4px; }
.muted { color: var(--muted); }
.sm { font-size: 13.5px; }
.center { text-align: center; }
.right { text-align: right; }
.grow { flex: 1; min-width: 0; }
.mt { margin-top: 14px; }
.mt-lg { margin-top: 28px; }
.mb { margin-bottom: 4px; }
.up { color: var(--accent); }
.down { color: var(--good); }

/* ---------- Rakenne ---------- */
.view { max-width: 560px; margin: 0 auto; padding-bottom: calc(var(--nav-h) + var(--safe-b) + 32px); }
.view.enter { animation: enter .32s var(--ease); }
body.in-session .view { padding-bottom: calc(var(--nav-h) + var(--safe-b) + 110px); }
@keyframes enter { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

.top {
  position: sticky; top: 0; z-index: 20;
  padding: calc(var(--safe-t) + 10px) 20px 12px;
  background: linear-gradient(var(--bg) 70%, rgba(10, 11, 13, 0));
  backdrop-filter: blur(0);
}
.top-row { display: flex; align-items: center; gap: 10px; min-height: 44px; }
.top-titles { flex: 1; min-width: 0; }
.top h1 { font-size: 22px; font-weight: 650; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.top-large h1 { font-size: 32px; font-weight: 700; }
.top-large { padding-top: calc(var(--safe-t) + 18px); }
.top-sub { color: var(--muted); font-size: 13.5px; font-weight: 500; }
.top-right { display: flex; gap: 6px; align-items: center; }

.content { padding: 4px 16px 0; display: flex; flex-direction: column; gap: 12px; }
.section-title { color: var(--muted); font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; margin: 14px 4px 0; }

/* ---------- Kortit ---------- */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 18px;
  box-shadow: var(--shadow);
  display: block;
}
.card-link { transition: transform .18s var(--ease), background .18s; }
.card-link:active { transform: scale(.985); background: var(--surface-2); }
.card-label { color: var(--muted); font-size: 13px; font-weight: 550; margin-bottom: 6px; letter-spacing: .01em; }
.row-between { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.h3 { font-size: 19px; font-weight: 650; letter-spacing: -0.01em; }
.meta { color: var(--muted); font-size: 13.5px; margin-top: 6px; }
.big { font-family: var(--font-display); font-size: 34px; font-weight: 650; letter-spacing: -0.03em; line-height: 1.1; }
.big small { font-size: 15px; color: var(--muted); font-weight: 500; letter-spacing: 0; }
.big.sm { font-size: 24px; }

.hero { padding: 22px; border-color: var(--border-strong); background: radial-gradient(120% 120% at 100% 0%, rgba(229, 57, 59, 0.07), transparent 55%), var(--surface); }
.hero-title { font-family: var(--font-display); font-size: 34px; font-weight: 750; letter-spacing: -0.03em; }
.hero-title.sm { font-size: 24px; }

.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.stat-grid.four { grid-template-columns: 1fr 1fr; }
.stat { padding: 16px 18px; }

.weight-card .wc-row { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
.wc-spark { width: 120px; }
.spark { width: 100%; height: auto; display: block; overflow: visible; }

/* ---------- Painikkeet ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 48px; padding: 0 18px; border-radius: 14px;
  font-weight: 600; font-size: 15.5px; letter-spacing: -0.005em;
  transition: transform .15s var(--ease), background .15s, opacity .15s;
  user-select: none; -webkit-user-select: none;
}
.btn:active:not(:disabled) { transform: scale(.97); }
.btn .ic { width: 19px; height: 19px; }
.btn-block { width: 100%; }
.btn-lg { height: 56px; font-size: 16.5px; border-radius: 16px; }
.btn-sm { height: 36px; padding: 0 12px; font-size: 14px; border-radius: 11px; }
.btn-sm .ic { width: 16px; height: 16px; }
.btn-primary { background: var(--accent); color: var(--accent-ink); }
.btn-primary:active:not(:disabled) { background: var(--accent-strong); }
.btn-soft { background: var(--surface-2); border: 1px solid var(--border); color: var(--text); }
.btn-ghost { color: var(--accent); }
.btn-danger { background: var(--bad); color: #1d0a09; }
.btn-danger-ghost { color: var(--bad); }
.icon-btn {
  width: 42px; height: 42px; border-radius: 13px; display: inline-flex; align-items: center; justify-content: center;
  background: var(--surface); border: 1px solid var(--border); color: var(--text); flex: none;
  transition: transform .15s var(--ease);
}
.icon-btn:active:not(:disabled) { transform: scale(.92); }
.icon-btn.sm { width: 34px; height: 34px; border-radius: 10px; }
.icon-btn.sm .ic { width: 17px; height: 17px; }
.icon-btn.danger { color: var(--bad); }
.link { color: var(--accent); font-weight: 550; }
.file-btn { position: relative; overflow: hidden; margin-top: 10px; }
.file-btn input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }

.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
.chip { height: 32px; padding: 0 13px; border-radius: 999px; background: var(--surface-2); color: var(--muted); font-size: 13.5px; font-weight: 550; border: 1px solid var(--border); transition: all .15s; }
.chip.on { background: var(--accent-soft); color: var(--accent); border-color: rgba(229, 57, 59, .25); }

.segmented { display: flex; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 4px; gap: 4px; }
.segmented > * { flex: 1; height: 38px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: var(--muted); transition: all .2s var(--ease); text-align: center; line-height: 1.15; padding: 0 6px; }
.segmented > .on { background: var(--surface-3); color: var(--text); box-shadow: 0 1px 2px rgba(0, 0, 0, .3); }

.badge { display: inline-flex; align-items: center; font-size: 12.5px; font-weight: 600; color: var(--accent); background: var(--accent-soft); border-radius: 999px; padding: 2px 9px; }
.delta { font-size: 14px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.delta.up, .delta.good { color: var(--good); }
.delta.down { color: var(--muted); }
.delta.bad { color: var(--bad); }

/* ---------- Listat ---------- */
.list { list-style: none; margin: 0; padding: 4px 0; }
.list > li + li { border-top: 1px solid var(--border); }
.list-row { display: flex; align-items: center; gap: 14px; padding: 14px 18px; }
.link-row:active, .list-row[data-action]:active { background: var(--surface-2); }
.num-badge { width: 28px; height: 28px; border-radius: 9px; background: var(--surface-2); color: var(--muted); display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; flex: none; }
.row-actions { display: flex; gap: 6px; }
.row-spark { width: 72px; }
.edit-row .grow { cursor: pointer; }

.ex-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
.ex-chips span { font-size: 12.5px; color: var(--muted); background: var(--surface-2); border-radius: 8px; padding: 4px 9px; }

.pr-list { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-direction: column; gap: 12px; }
.pr-list li { display: flex; gap: 12px; align-items: center; }
.pr-list li > div { display: flex; flex-direction: column; min-width: 0; }
.pr-ic { width: 36px; height: 36px; border-radius: 11px; background: var(--accent-soft); color: var(--accent); display: inline-flex; align-items: center; justify-content: center; flex: none; }
.pr-ic .ic { width: 18px; height: 18px; }

.mini-hist { list-style: none; margin: 4px 0 0; padding: 0; }
.mini-hist li, .mini-hist li a { display: flex; justify-content: space-between; gap: 14px; padding: 9px 0; font-size: 14.5px; }
.mini-hist li + li { border-top: 1px solid var(--border); }
.mini-hist li span:last-child { text-align: right; }

.empty { text-align: center; padding: 48px 20px; }
.empty-ic { width: 64px; height: 64px; margin: 0 auto 16px; border-radius: 20px; background: var(--surface); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; color: var(--accent); }
.empty h3 { font-size: 19px; margin-bottom: 6px; }
.empty p { color: var(--muted); margin: 0 0 20px; }

/* ---------- Aktiivinen treeni ---------- */
.active-banner {
  display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: var(--radius);
  background: var(--accent-soft); border: 1px solid rgba(229, 57, 59, .22);
}
.ab-text { flex: 1; display: flex; flex-direction: column; font-size: 14px; }
.ab-text span { color: var(--muted); font-size: 13px; }
.ab-cta { color: var(--accent); font-weight: 600; display: flex; align-items: center; font-size: 14.5px; }
.ab-cta .ic { width: 18px; height: 18px; }
.pulse { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 0 rgba(229, 57, 59, .6); animation: pulse 2s infinite; }
@keyframes pulse { 70% { box-shadow: 0 0 0 9px rgba(229, 57, 59, 0); } 100% { box-shadow: 0 0 0 0 rgba(229, 57, 59, 0); } }

.progress { height: 5px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.progress-bar { height: 100%; background: var(--accent); border-radius: 99px; transition: width .4s var(--ease); }
.progress-label { margin: -4px 2px 0; }

.ex-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 10px; }
.ex-card { display: flex; align-items: center; gap: 14px; padding: 16px; }
.ex-card.complete b { color: var(--muted); }
.ex-ring { width: 42px; height: 42px; border-radius: 50%; border: 1.5px solid var(--border-strong); display: flex; align-items: center; justify-content: center; font-size: 12.5px; font-weight: 600; color: var(--muted); flex: none; }
.ex-ring.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.ex-ring .ic { width: 20px; height: 20px; stroke-width: 2.4; }

.notes, .fields textarea {
  width: 100%; background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--radius-sm);
  padding: 12px 14px; resize: vertical; min-height: 80px; font-size: 16px; outline: none;
}
.notes:focus { border-color: rgba(229, 57, 59, .4); }

.prev-sets { display: grid; grid-template-columns: repeat(auto-fill, minmax(88px, 1fr)); gap: 8px; margin-top: 4px; }
.prev-sets > div { background: var(--surface-2); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; font-size: 14px; }
.prev-sets > div .muted { font-size: 11.5px; }
.prev-sets b { font-size: 16px; }
.prev-best { margin-top: 12px; font-size: 13.5px; color: var(--accent); }

.sets-card { padding: 14px 12px; }
.set-head, .set-row { display: grid; grid-template-columns: 34px 58px 1fr 1fr 52px; gap: 8px; align-items: center; }
.set-head { color: var(--muted); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; padding: 0 2px 8px; text-align: center; }
.set-row { padding: 5px 2px; border-radius: 14px; transition: background .2s; }
.set-row.done { background: rgba(229, 57, 59, .06); }
.set-no { text-align: center; font-weight: 650; color: var(--muted); }
.set-prev { text-align: center; color: var(--faint); font-size: 13px; }
.set-input {
  width: 100%; height: 50px; border-radius: 13px; background: var(--surface-2); border: 1px solid var(--border);
  text-align: center; font-size: 19px; font-weight: 600; outline: none; padding: 0 4px;
  transition: border-color .15s, background .15s;
}
.set-input::placeholder { color: var(--faint); font-weight: 500; }
.set-input:focus { border-color: rgba(229, 57, 59, .5); background: var(--surface-3); }
.set-row.done .set-input { background: transparent; border-color: transparent; color: var(--text); }
.set-check {
  width: 50px; height: 50px; border-radius: 14px; background: var(--surface-2); border: 1px solid var(--border-strong);
  display: flex; align-items: center; justify-content: center; color: var(--faint); transition: all .2s var(--ease);
}
.set-check .ic { width: 24px; height: 24px; stroke-width: 2.4; }
.set-check:active { transform: scale(.9); }
.set-row.done .set-check { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); animation: pop .3s var(--ease); }
@keyframes pop { 50% { transform: scale(1.1); } }
.set-tools { display: flex; justify-content: space-between; margin-top: 8px; }

.ex-nav { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px; }

/* ---------- Yhteenveto ---------- */
.summary { padding-top: calc(var(--safe-t) + 36px); }
.summary h1 { font-size: 30px; }
.summary-badge { width: 76px; height: 76px; border-radius: 50%; margin: 0 auto 8px; background: var(--accent); color: var(--accent-ink); display: flex; align-items: center; justify-content: center; animation: pop .5s var(--ease); }
.summary-badge .ic { width: 38px; height: 38px; stroke-width: 2.4; }
.pr-card { border-color: rgba(229, 57, 59, .25); }

/* ---------- Historia ---------- */
.hist-card { display: flex; gap: 14px; align-items: center; padding: 14px 16px; }
.date-box { width: 50px; height: 54px; border-radius: 14px; background: var(--surface-2); display: flex; flex-direction: column; align-items: center; justify-content: center; flex: none; }
.date-box b { font-size: 19px; line-height: 1; }
.date-box span { font-size: 11.5px; color: var(--muted); text-transform: capitalize; margin-top: 3px; }
.note-line { font-size: 13px; color: var(--faint); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sets-table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 15px; }
.sets-table th { color: var(--muted); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; text-align: left; padding: 6px 4px; }
.sets-table td { padding: 8px 4px; border-top: 1px solid var(--border); }
.sets-table td:first-child { color: var(--muted); width: 50px; }
.tbl-input { width: 100%; max-width: 90px; height: 40px; border-radius: 10px; background: var(--surface-2); border: 1px solid var(--border); text-align: center; font-size: 16px; outline: none; }

/* ---------- Graafit ---------- */
.chart-card .row-between { align-items: flex-start; }
.chart { position: relative; margin-top: 18px; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.chart-svg { width: 100%; height: auto; display: block; overflow: visible; }
.c-grid { stroke: var(--border); stroke-width: 1; }
.c-line { fill: none; stroke: var(--accent); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.c-dot { fill: var(--bg); stroke: var(--accent); stroke-width: 1.5; }
.c-dot-last { fill: var(--accent); stroke: var(--bg); stroke-width: 2; }
.c-cursor { stroke: var(--muted); stroke-width: 1; stroke-dasharray: 3 3; }
.chart-axis { display: flex; justify-content: space-between; font-size: 12px; color: var(--faint); margin-top: 4px; }
.chart-hi { position: absolute; transform: translateX(-50%); font-size: 11.5px; color: var(--muted); font-weight: 600; pointer-events: none; transition: opacity .15s; white-space: nowrap; }
.chart-tip { position: absolute; top: -8px; transform: translateX(-50%); background: var(--surface-3); border: 1px solid var(--border-strong); border-radius: 10px; padding: 6px 10px; font-size: 12.5px; display: flex; flex-direction: column; align-items: center; pointer-events: none; white-space: nowrap; box-shadow: 0 8px 20px rgba(0, 0, 0, .4); }
.chart-tip[hidden] { display: none; }
.chart-tip span { color: var(--muted); font-size: 11.5px; }
.chart-empty { height: 150px; display: flex; align-items: center; justify-content: center; color: var(--faint); font-size: 14px; border: 1px dashed var(--border-strong); border-radius: 14px; margin-top: 16px; }

.rep-records { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.rep-records div { background: var(--surface-2); border-radius: 12px; padding: 10px; display: flex; flex-direction: column; font-size: 13px; color: var(--muted); }
.rep-records b { color: var(--text); font-size: 15px; }

.pr-row .pr-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 12px; }
.pr-grid > div { display: flex; flex-direction: column; gap: 1px; }
.pr-grid b { font-size: 16px; }

/* ---------- Kehon mitat ---------- */
.figure-card { display: grid; grid-template-columns: 120px 1fr; gap: 16px; align-items: center; padding: 18px 16px; }
.figure-wrap { position: relative; width: 120px; height: 220px; }
.figure { width: 100%; height: 100%; color: #d9dde2; opacity: .9; }
.fig-lines { stroke: var(--accent); opacity: .7; }
.hotspot { position: absolute; width: 34px; height: 34px; transform: translate(-50%, -50%); display: flex; align-items: center; justify-content: center; }
.hotspot span { width: 12px; height: 12px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px rgba(229, 57, 59, .18); transition: transform .2s; }
.hotspot:active span { transform: scale(1.4); }
.figure-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.figure-list li + li { border-top: 1px solid var(--border); }
.figure-list a { display: flex; align-items: center; gap: 10px; padding: 12px 0; }
.figure-list .grow { display: flex; flex-direction: column; }
.figure-list b { font-size: 18px; }
.figure-list .delta { font-size: 12.5px; }
.figure-list .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex: none; }
.stat .spark { margin-top: 10px; }

/* ---------- Asetukset ---------- */
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 16px; margin-top: 18px; font-size: 15px; cursor: pointer; }
.toggle input { display: none; }
.toggle i { width: 50px; height: 30px; border-radius: 99px; background: var(--surface-3); position: relative; flex: none; transition: background .2s; }
.toggle i::after { content: ''; position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: transform .25s var(--ease); box-shadow: 0 2px 4px rgba(0, 0, 0, .3); }
.toggle input:checked + i { background: var(--accent); }
.toggle input:checked + i::after { transform: translateX(20px); }

/* ---------- Lomakkeet ---------- */
.fields { display: flex; flex-wrap: wrap; gap: 12px; }
.field { display: flex; flex-direction: column; gap: 6px; width: 100%; }
.field.half { width: calc(50% - 6px); }
.field.third { width: calc(33.333% - 8px); }
.field span { font-size: 13px; color: var(--muted); font-weight: 550; }
.field input, .field select {
  height: 50px; border-radius: var(--radius-sm); background: var(--surface-2); border: 1px solid var(--border);
  padding: 0 14px; font-size: 16px; outline: none; width: 100%; -webkit-appearance: none; appearance: none;
}
.field input[type="date"] { line-height: 50px; }
.field input:focus, .field select:focus, .field textarea:focus { border-color: rgba(229, 57, 59, .5); }
.field .invalid { border-color: var(--bad); }
.fields + .field { margin-top: 12px; }

/* ---------- Alavalikko ---------- */
.nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 30;
  display: flex; justify-content: space-around;
  padding: 6px 6px calc(var(--safe-b) + 6px);
  background: rgba(14, 15, 18, .86);
  backdrop-filter: saturate(160%) blur(18px); -webkit-backdrop-filter: saturate(160%) blur(18px);
  border-top: 1px solid var(--border);
}
.nav a { flex: 1; max-width: 110px; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 0 4px; color: var(--faint); font-size: 10.5px; font-weight: 600; transition: color .2s; }
.nav a .ic { width: 24px; height: 24px; transition: transform .2s var(--ease); }
.nav a.on { color: var(--accent); }
.nav a:active .ic { transform: scale(.88); }

/* ---------- Lepoajastin ---------- */
.rest {
  position: fixed; left: 12px; right: 12px; bottom: calc(var(--nav-h) + var(--safe-b) + 12px); z-index: 25;
  max-width: 536px; margin: 0 auto;
  background: rgba(28, 31, 36, .94); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  border: 1px solid var(--border-strong); border-radius: 20px; overflow: hidden;
  box-shadow: 0 16px 40px -10px rgba(0, 0, 0, .7);
  animation: up .3s var(--ease);
}
@keyframes up { from { transform: translateY(20px); opacity: 0; } }
.rest-bar { height: 3px; background: var(--surface-3); }
.rest-bar i { display: block; height: 100%; background: var(--accent); transition: width .5s linear; }
.rest-inner { display: flex; align-items: center; gap: 8px; padding: 10px 12px; }
.rest-time { flex: 1; display: flex; flex-direction: column; align-items: center; line-height: 1.1; }
.rest-time b { font-size: 28px; font-weight: 650; font-family: var(--font-display); letter-spacing: -0.02em; }
.rest-btn { height: 44px; min-width: 56px; padding: 0 10px; border-radius: 12px; background: var(--surface-3); font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; }
.rest-btn.close { min-width: 44px; color: var(--muted); }
.rest-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 8px 0 6px; }
.rest-grid .btn { padding: 0; }

/* ---------- Alapaneeli ---------- */
.sheet-wrap { position: fixed; inset: 0; z-index: 50; }
.sheet-backdrop { position: absolute; inset: 0; background: rgba(0, 0, 0, .55); opacity: 0; transition: opacity .25s; }
.sheet {
  position: absolute; left: 0; right: 0; bottom: 0; max-width: 560px; margin: 0 auto;
  background: var(--surface); border-top-left-radius: 26px; border-top-right-radius: 26px;
  border: 1px solid var(--border-strong); border-bottom: 0;
  padding: 10px 20px calc(var(--safe-b) + 18px);
  transform: translateY(100%); transition: transform .3s var(--ease);
  max-height: 88vh; overflow-y: auto;
}
.sheet-wrap.open .sheet-backdrop { opacity: 1; }
.sheet-wrap.open .sheet { transform: none; }
.sheet-grip { width: 38px; height: 5px; border-radius: 9px; background: var(--surface-3); margin: 0 auto 14px; }
.sheet-title { font-size: 20px; font-weight: 650; margin-bottom: 6px; }
.sheet-text { color: var(--muted); margin: 0 0 8px; }
.sheet-actions { display: flex; flex-direction: column; gap: 6px; margin-top: 18px; }
.sheet-form .fields { margin-top: 14px; }
.sheet-form > .btn-danger-ghost { margin-top: 10px; }

/* ---------- Ilmoitukset ---------- */
.toasts { position: fixed; top: calc(var(--safe-t) + 10px); left: 0; right: 0; z-index: 60; display: flex; flex-direction: column; align-items: center; gap: 8px; pointer-events: none; padding: 0 16px; }
.toast {
  display: flex; align-items: center; gap: 10px; max-width: 420px;
  background: rgba(35, 39, 44, .96); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--border-strong); border-radius: 16px; padding: 12px 16px; font-size: 14.5px;
  box-shadow: 0 12px 30px rgba(0, 0, 0, .5);
  transform: translateY(-16px); opacity: 0; transition: all .3s var(--ease);
}
.toast.show { transform: none; opacity: 1; }
.toast .ic { width: 19px; height: 19px; color: var(--accent); }
.toast.pr { border-color: rgba(229, 57, 59, .45); background: rgba(22, 36, 48, .97); }
.toast.pr .ic { width: 22px; height: 22px; }
.toast.error .ic { color: var(--bad); }

/* ---------- Työpöytä ---------- */
@media (min-width: 700px) {
  .content { padding: 4px 20px 0; }
  .stat-grid.four { grid-template-columns: repeat(4, 1fr); }
  .nav { left: 50%; right: auto; transform: translateX(-50%); width: 520px; bottom: 16px; border-radius: 22px; border: 1px solid var(--border-strong); padding: 6px; }
  .rest { bottom: calc(var(--nav-h) + 40px); }
}
@media (hover: hover) {
  .card-link:hover { background: var(--surface-2); }
  .btn-soft:hover { background: var(--surface-3); }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* ---------- Viikkorytmi ja ohjeet ---------- */
.mt-sm { margin: 10px 0 0; }
.week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 4px; }
.day { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 0; border-radius: 12px; background: var(--surface-2); border: 1px solid var(--border); min-width: 0; }
.day span { font-size: 11.5px; color: var(--muted); font-weight: 600; }
.day b { font-size: 10.5px; color: var(--faint); font-weight: 650; letter-spacing: .02em; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding: 0 2px; }
.day.train b { color: var(--accent); }
.day.today { border-color: rgba(229, 57, 59, .5); }
.day.today span { color: var(--text); }
.guide { margin: 4px 0 0; padding-left: 18px; display: flex; flex-direction: column; gap: 8px; font-size: 14.5px; color: var(--text); }
.guide li::marker { color: var(--accent); }
.guide-card { padding: 14px 18px; }
.guide-card summary { cursor: pointer; color: var(--muted); font-size: 14px; font-weight: 600; list-style: none; }
.guide-card summary::-webkit-details-marker { display: none; }
.guide-card summary::after { content: ' ›'; }
.guide-card[open] summary { margin-bottom: 10px; }
.hint { margin-top: 12px; font-size: 13.5px; color: var(--good); }

/* =========================================================
   v2 – urheilullisempi ja selkeämpi ilme
   ========================================================= */
:root {
  --bg: #07080a;
  --surface: #101216;
  --surface-2: #171a1f;
  --surface-3: #20242a;
  --border: rgba(255, 255, 255, 0.07);
  --border-strong: rgba(255, 255, 255, 0.13);
  --text: #f2f5f8;
  --muted: #8b939e;
  --faint: #4f5761;
  --accent: #e5393b;
  --accent-strong: #ff6a64;
  --accent-soft: rgba(229, 57, 59, 0.10);
  --glow: rgba(229, 57, 59, 0.16);
  --font: "Inter", -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  --font-display: "Barlow Condensed", "SF Pro Display", -apple-system, "Arial Narrow", sans-serif;
}
body { font-size: 15.5px; }

/* Otsikot */
.top h1 { font-family: var(--font-display); font-size: 28px; font-weight: 700; letter-spacing: 0.005em; }
.top-large h1 { font-size: 44px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.01em; line-height: 1; }
.top-sub { font-size: 12.5px; text-transform: uppercase; letter-spacing: .1em; font-weight: 600; }
.wordmark { font-family: var(--font-display); font-weight: 800; font-size: 22px; letter-spacing: .22em; color: var(--accent); line-height: 1.1; }
.top-home { padding-top: calc(var(--safe-t) + 16px); }

.card-label, .section-title { text-transform: uppercase; letter-spacing: .13em; font-size: 11.5px; font-weight: 650; color: var(--muted); }
.card { border-radius: 22px; }
.big { font-family: var(--font-display); font-size: 48px; font-weight: 700; letter-spacing: 0; line-height: 1; }
.big.sm { font-size: 32px; }
.big small { font-family: var(--font); font-size: 14px; }
.name-lg { font-family: var(--font-display); font-size: 40px; font-weight: 800; text-transform: uppercase; line-height: 1; letter-spacing: .01em; }
.name-md { font-family: var(--font-display); font-size: 28px; font-weight: 700; text-transform: uppercase; line-height: 1.05; }
.hero-title { font-family: var(--font-display); font-weight: 800; text-transform: uppercase; letter-spacing: .01em; }

/* Etusivun pääkortti */
.hero2 {
  position: relative; overflow: hidden;
  border-radius: 26px; padding: 22px 20px 20px;
  background:
    radial-gradient(90% 70% at 100% 0%, var(--glow), transparent 60%),
    linear-gradient(180deg, #13161b, var(--surface));
  border: 1px solid var(--border-strong);
  box-shadow: 0 1px 0 rgba(255, 255, 255, .05) inset, 0 24px 50px -30px rgba(229, 57, 59, .3);
}
.eyebrow { display: inline-flex; align-items: center; gap: 8px; font-size: 11.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
.eyebrow::before { content: ''; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 10px var(--accent); }
.hero-name { font-family: var(--font-display); font-size: 84px; font-weight: 800; line-height: .9; letter-spacing: .005em; text-transform: uppercase; margin-top: 10px; }
.hero-sub { color: var(--muted); font-size: 15px; margin-top: 6px; }
.hero-list { list-style: none; counter-reset: ex; margin: 18px 0 18px; padding: 0; display: flex; flex-direction: column; }
.hero-list li { counter-increment: ex; display: flex; align-items: center; gap: 12px; padding: 9px 0; border-top: 1px solid var(--border); font-size: 14.5px; }
.hero-list li::before { content: counter(ex); font-family: var(--font-display); font-weight: 700; font-size: 17px; color: var(--faint); width: 14px; }
.hero-list li span { flex: 1; min-width: 0; }
.hero-list li b { font-family: var(--font-display); font-weight: 600; font-size: 17px; color: var(--muted); letter-spacing: .02em; }

/* Viikko */
.week-top { display: flex; align-items: center; gap: 16px; }
.ring-wrap { position: relative; width: 76px; height: 76px; flex: none; }
.ring { width: 76px; height: 76px; }
.ring-bg { fill: none; stroke: var(--surface-3); stroke-width: 7; }
.ring-fg { fill: none; stroke: var(--accent); stroke-width: 7; stroke-linecap: round; transition: stroke-dasharray .6s var(--ease); filter: drop-shadow(0 0 6px rgba(229, 57, 59, .45)); }
.ring-num { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--font-display); }

.wdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-top: 18px; }
.wd { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }

.wd small { font-size: 9.5px; font-weight: 700; letter-spacing: .04em; color: var(--faint); height: 12px; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.wd.off i::after { content: ''; width: 4px; height: 4px; border-radius: 50%; background: var(--surface-3); }

/* Kolmen luvun rivi */
.trio { display: grid; grid-template-columns: repeat(3, 1fr); padding: 16px 6px; }

/* Painikkeet */
.btn { font-weight: 650; }
.btn-lg { height: 58px; font-size: 16px; letter-spacing: .01em; }
.btn-primary { background: linear-gradient(180deg, #ff6a64, var(--accent)); box-shadow: 0 8px 24px -10px rgba(229, 57, 59, .7), 0 1px 0 rgba(255, 255, 255, .5) inset; }

/* Treenit ja sessio */

.rest-time b { font-size: 38px; font-weight: 800; }

.date-box b { font-family: var(--font-display); font-size: 24px; }
.summary h1 { font-family: var(--font-display); font-size: 44px; text-transform: uppercase; font-weight: 800; }
.stat .big.sm, .figure-list b, .pr-grid b, .rep-records b { font-family: var(--font-display); }
.figure-list b { font-size: 24px; }
.pr-grid b { font-size: 21px; }

/* Alavalikko */
.nav a { font-size: 10px; letter-spacing: .02em; }
.nav a .ic { width: 23px; height: 23px; }
.nav a.on .ic { filter: drop-shadow(0 0 8px rgba(229, 57, 59, .55)); }
.nav a { position: relative; }
.nav a.on::before { content: ''; position: absolute; top: -7px; width: 22px; height: 3px; border-radius: 0 0 3px 3px; background: var(--accent); box-shadow: 0 0 10px var(--accent); }

.top { background: rgba(7, 8, 10, .82); backdrop-filter: saturate(150%) blur(16px); -webkit-backdrop-filter: saturate(150%) blur(16px); }

/* =================== Elämäntapaosat (v2) =================== */
button.list-row { width: 100%; background: none; border: 0; color: inherit; text-align: left; font: inherit; }

.food-sum .fs-row { display: flex; align-items: center; gap: 16px; }

.rem-list .list-row { padding: 12px 16px; }

.step + .step { border-top: 1px solid var(--border); }
.step-ic { width: 26px; height: 26px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; background: var(--surface-3); color: var(--muted); font-weight: 700; font-size: 14px; }
.step-ic .ic { width: 15px; height: 15px; stroke-width: 2.8; }
.step.ok .step-ic { background: rgba(130, 209, 174, .16); color: var(--good); }
.step.warn .step-ic { background: rgba(238, 147, 140, .16); color: var(--bad); }
.step b { font-size: 15px; }

.food-sheet .search-wrap { position: relative; margin-top: 12px; }
.food-sheet .search-wrap .ic { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); pointer-events: none; }
.food-sheet .search { width: 100%; height: 48px; border-radius: 14px; border: 1px solid var(--border-strong); background: var(--surface-2); color: var(--text); font-size: 16px; padding: 0 14px 0 42px; outline: none; -webkit-appearance: none; }
.food-sheet .meal-pick > * { font-size: 13px; padding: 0 4px; }
.food-pane { min-height: 220px; max-height: 46vh; overflow-y: auto; margin-top: 8px; -webkit-overflow-scrolling: touch; }
.fr-title { font-size: 12px; font-weight: 650; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; margin: 12px 2px 4px; }
.fr-list { list-style: none; margin: 0; padding: 0; }
.fr-list li { display: flex; align-items: center; gap: 8px; }
.fr-list li + li { border-top: 1px solid var(--border); }
.fr-main { flex: 1; background: none; border: 0; color: var(--text); text-align: left; padding: 10px 2px; display: flex; flex-direction: column; font: inherit; min-width: 0; }
.fr-main b { font-weight: 550; font-size: 15px; }
.fr-add { background: var(--accent-soft); color: var(--accent); }
.fr-add.added { background: var(--accent); color: var(--accent-ink); }
.amount-view { display: flex; flex-direction: column; gap: 10px; padding-top: 6px; }
.amount-view .field input { font-size: 22px; font-weight: 650; }
.amount-view .chips { margin-top: 0; }
.amt-preview { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px; background: var(--surface-2); border-radius: 14px; }
.amt-preview b { font-family: var(--font-display); font-size: 26px; }
.amt-preview span { font-size: 13px; color: var(--muted); }

.day-pick { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; }
.day-pick button { height: 40px; border-radius: 12px; border: 1px solid var(--border); background: var(--surface-2); color: var(--muted); font-weight: 650; font-size: 14px; }
.day-pick button.on { background: var(--accent-soft); color: var(--accent); border-color: rgba(229, 57, 59, .3); }
.rem-form input[type="time"] { line-height: 50px; }
.snooze-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.snooze-row .muted { margin-right: 4px; }

.sheet-ic .ic { width: 24px; height: 24px; }

.chart.bars { margin-top: 6px; }
.c-bar { fill: var(--accent); opacity: .85; }
.c-bar.over { fill: var(--bad); }
.c-bar.empty { fill: var(--surface-3); }
.c-goal { stroke: var(--good); stroke-width: 1.2; stroke-dasharray: 4 4; }

/* =========================================================
   v3 – sulavuus, liike ja viimeistely
   ========================================================= */
:root {
  --spring: cubic-bezier(.32, .72, 0, 1);
  --bounce: cubic-bezier(.34, 1.56, .64, 1);
  --grad-accent: linear-gradient(135deg, #ff8a85 0%, #e5393b 45%, #b82024 100%);
  --grad-good: linear-gradient(135deg, #a6f0cf, #63c79c);
  --card-edge: linear-gradient(180deg, rgba(255, 255, 255, .12), rgba(255, 255, 255, .025) 40%, rgba(255, 255, 255, .015));
}

/* Taustan hehku */
body::before {
  content: ''; position: fixed; inset: -20vh -20vw auto; height: 70vh; z-index: -1; pointer-events: none;
  background:
    radial-gradient(60% 55% at 15% 10%, rgba(229, 57, 59, .16), transparent 70%),
    radial-gradient(45% 45% at 90% 0%, rgba(99, 199, 156, .10), transparent 70%),
    radial-gradient(40% 40% at 60% 30%, rgba(255, 255, 255, .03), transparent 70%);
  filter: blur(10px);
}
html, body { background: var(--bg); }
body { -webkit-font-smoothing: antialiased; }
.big, .fl-kcal, .task-time, .rem-time, .ring-num b, .kv b { font-variant-numeric: tabular-nums; }

/* Kortit: hienovarainen valoreuna ja syvyys */
.card {
  border: 1px solid transparent;
  background: linear-gradient(var(--surface), var(--surface)) padding-box, var(--card-edge) border-box;
  box-shadow: 0 1px 0 rgba(255, 255, 255, .04) inset, 0 18px 40px -24px rgba(0, 0, 0, .9);
}
.card-link, .quick, .task-main, .food-list li, .fr-main, .rem-list .grow, .figure-list a, .list-row.link-row, .hist-card {
  transition: transform .35s var(--spring), background-color .2s, opacity .2s;
}
.card-link:active, .quick:active { transform: scale(.975); }
.food-list li:active, .fr-main:active, .rem-list .grow:active, .task-main:active { opacity: .6; }

/* Otsikko ja logo */
.wordmark { background: var(--grad-accent); -webkit-background-clip: text; background-clip: text; color: transparent; }
.top { transition: box-shadow .25s, border-color .25s; border-bottom: 1px solid transparent; background: rgba(7, 8, 10, .55); }
body.scrolled .top { border-bottom-color: var(--border); box-shadow: 0 10px 30px -20px rgba(0, 0, 0, .9); background: rgba(7, 8, 10, .78); }

/* Painikkeet */
.btn { transition: transform .3s var(--spring), background .2s, box-shadow .3s, opacity .2s; }
.btn:active:not(:disabled) { transform: scale(.96); }
.btn-primary {
  background: var(--grad-accent); color: #ffffff;
  box-shadow: 0 10px 28px -12px rgba(229, 57, 59, .75), 0 1px 0 rgba(255, 255, 255, .5) inset;
  position: relative; overflow: hidden;
}
.btn-primary::after {
  content: ''; position: absolute; inset: 0; transform: translateX(-120%);
  background: linear-gradient(100deg, transparent 30%, rgba(255, 255, 255, .45) 50%, transparent 70%);
}
.btn-primary:active:not(:disabled) { background: var(--grad-accent); box-shadow: 0 4px 14px -8px rgba(229, 57, 59, .8); }
.view.enter .btn-primary.btn-lg::after { animation: sheen 1.4s .5s var(--spring) both; }
@keyframes sheen { to { transform: translateX(120%); } }
.icon-btn { transition: transform .3s var(--spring), background .2s; }
.icon-btn:active { transform: scale(.88); }
.chip { transition: transform .3s var(--spring), background .2s, color .2s, border-color .2s; }
.chip:active { transform: scale(.93); }
.segmented > * { transition: background .3s var(--spring), color .2s, box-shadow .3s; }
.toggle i, .toggle i::after { transition-timing-function: var(--spring); transition-duration: .35s; }

/* Näkymän sisääntulo: kortit liukuvat porrastetusti */
.view.enter { animation: none; }
.view.enter .top { animation: fadeIn .4s var(--spring) both; }
.view.enter .content > * { animation: cardIn .55s var(--spring) both; }
.view.enter .content > *:nth-child(1) { animation-delay: .02s; }
.view.enter .content > *:nth-child(2) { animation-delay: .06s; }
.view.enter .content > *:nth-child(3) { animation-delay: .10s; }
.view.enter .content > *:nth-child(4) { animation-delay: .14s; }
.view.enter .content > *:nth-child(5) { animation-delay: .18s; }
.view.enter .content > *:nth-child(6) { animation-delay: .22s; }
.view.enter .content > *:nth-child(7) { animation-delay: .26s; }
.view.enter .content > *:nth-child(n+8) { animation-delay: .30s; }
@keyframes cardIn { from { opacity: 0; transform: translateY(14px) scale(.985); } to { opacity: 1; transform: none; } }
@keyframes fadeIn { from { opacity: 0; } }

/* Renkaat piirtyvät */
.ring-fg { transition: stroke-dashoffset .9s var(--spring), stroke .3s, opacity .3s; stroke: var(--accent); }
.ring-fg.zero { opacity: 0; }
.view.enter .ring-fg { animation: ringDraw 1.1s .15s var(--spring) both; }
@keyframes ringDraw { from { stroke-dashoffset: var(--circ); } }
.ring-fg { filter: none; }
.today-top .ring, .fs-kcal .ring, .ring-wrap .ring { overflow: visible; filter: drop-shadow(0 0 6px rgba(229, 57, 59, .35)); }

/* Palkit kasvavat */
.macro-bar i, .progress-bar { transition: width .8s var(--spring), background .3s; background: var(--grad-accent); }
.macro-bar i.over { background: linear-gradient(90deg, #ffb3aa, #ee938c); }
.view.enter .macro-bar i { animation: growX .9s .2s var(--spring) both; transform-origin: left; }
@keyframes growX { from { transform: scaleX(0); } }
.c-bar { transform-box: fill-box; transform-origin: bottom; }
.view.enter .c-bar { animation: growY .7s var(--spring) both; animation-delay: calc(var(--i, 0) * 25ms + .15s); }
@keyframes growY { from { transform: scaleY(0); } }

/* Tehtävät: kuittaus pomppaa ja ruksi piirtyy */
.task-check { transition: background .25s, border-color .25s, color .2s, transform .35s var(--bounce); }
.task-check:active { transform: scale(.85); }
.task-check .ic path { stroke-dasharray: 22; stroke-dashoffset: 22; transition: stroke-dashoffset .35s .05s var(--spring); }
.task-list li.done .task-check { background: var(--grad-accent); border-color: transparent; box-shadow: 0 0 0 4px rgba(229, 57, 59, .12), 0 6px 16px -6px rgba(229, 57, 59, .8); }
.task-list li.done .task-check .ic path { stroke-dashoffset: 0; }
.task-title { transition: color .3s; }
.popping { animation: popIn .45s var(--bounce); }
@keyframes popIn { 0% { transform: scale(1); } 35% { transform: scale(1.06); } 100% { transform: scale(1); } }

/* Uudet rivit liukuvat sisään */
.food-list li, .fr-list li, .rem-list > li, .task-list li { animation: rowIn .45s var(--spring) both; }
@keyframes rowIn { from { opacity: 0; transform: translateY(6px); } }
.fr-add { transition: transform .3s var(--bounce), background .2s, color .2s; }
.amt-preview b { transition: color .2s; }
.food-pane > * { animation: fadeIn .25s both; }

/* Pikatoiminnot */
.quick { background: linear-gradient(var(--surface), var(--surface)) padding-box, var(--card-edge) border-box; border: 1px solid transparent; }
.quick .ic { filter: drop-shadow(0 0 8px rgba(229, 57, 59, .35)); }
.quick.hl { background: linear-gradient(160deg, rgba(229, 57, 59, .22), rgba(229, 57, 59, .06)) padding-box, var(--card-edge) border-box; }

/* Korostetut kortit */
.today-top { background: radial-gradient(120% 140% at 0% 0%, rgba(229, 57, 59, .16), transparent 60%) padding-box, linear-gradient(var(--surface), var(--surface)) padding-box, var(--card-edge) border-box; }
.food-sum { background: radial-gradient(120% 140% at 100% 0%, rgba(99, 199, 156, .10), transparent 60%) padding-box, linear-gradient(var(--surface), var(--surface)) padding-box, var(--card-edge) border-box; }
.notice { background: linear-gradient(180deg, rgba(238, 147, 140, .10), rgba(238, 147, 140, .02)) padding-box, linear-gradient(180deg, rgba(238, 147, 140, .35), rgba(238, 147, 140, .08)) border-box; border: 1px solid transparent; }
.notice > .ic { animation: ring 2.6s 1s ease-in-out infinite; transform-origin: 50% 10%; }
.notice.ok { background: linear-gradient(180deg, rgba(130, 209, 174, .09), rgba(130, 209, 174, .02)) padding-box, linear-gradient(180deg, rgba(130, 209, 174, .32), rgba(130, 209, 174, .06)) border-box; }
.notice.ok > .ic { animation: none; }
@keyframes ring { 0%, 70%, 100% { transform: rotate(0); } 74% { transform: rotate(14deg); } 80% { transform: rotate(-12deg); } 86% { transform: rotate(8deg); } 92% { transform: rotate(-4deg); } }
.next-rem .ic { animation: ring 3s 1.5s ease-in-out infinite; transform-origin: 50% 10%; }

/* Alapaneeli: jousiliike, sumea tausta ja pyyhkäisy */
.sheet-backdrop { background: rgba(0, 0, 0, .5); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); transition: opacity .35s var(--spring); }
.sheet {
  transition: transform .5s var(--spring);
  background: linear-gradient(180deg, #15181d, var(--surface) 120px);
  box-shadow: 0 -20px 60px -20px rgba(0, 0, 0, .8);
  border-color: rgba(255, 255, 255, .12);
  overscroll-behavior: contain;
}
.sheet-grip { width: 42px; height: 5px; background: rgba(255, 255, 255, .22); margin-bottom: 16px; padding: 6px 0; background-clip: content-box; box-sizing: content-box; cursor: grab; }
.sheet-wrap.open .sheet > *:not(.sheet-grip) { animation: cardIn .45s .05s var(--spring) both; }

/* Ilmoitusbanneri */
.toast { transition: transform .5s var(--spring), opacity .3s; transform: translateY(-24px) scale(.95); }
.toast.show { transform: none; }
.toast .ic { color: var(--good); }

/* Alavalikko: aktiivinen kohta liukuu ja kuvake pomppaa */
.nav a .ic { transition: transform .4s var(--bounce), filter .3s; }
.nav a.on .ic { animation: navPop .5s var(--bounce); }
@keyframes navPop { 0% { transform: scale(.8); } 60% { transform: scale(1.15); } 100% { transform: scale(1); } }
.nav a::after { content: ''; position: absolute; inset: 2px 10%; border-radius: 14px; background: var(--accent-soft); opacity: 0; transform: scale(.7); transition: opacity .3s, transform .4s var(--spring); z-index: -1; }
.nav a.on::after { opacity: 1; transform: none; }
.nav a.on::before { transition: all .3s; }

/* Konfetti */
.confetti { position: fixed; inset: 0; pointer-events: none; z-index: 70; }
.confetti i { position: absolute; width: 8px; height: 12px; border-radius: 2px; animation: confetti 1.1s var(--spring) forwards; }
@keyframes confetti {
  0% { transform: translate(-50%, -50%) scale(.4); opacity: 1; }
  70% { opacity: 1; }
  100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy) + 120px)) rotate(var(--r)) scale(1); opacity: 0; }
}

/* Aktiivisen treenin pulssi ja sarjat */
.set-check { transition: background .25s, color .2s, transform .35s var(--bounce); }
.set-check:active { transform: scale(.85); }
.ex-ring.on { background: var(--grad-accent); border-color: transparent; }

/* Liikkeen vähentäminen */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition-duration: .01ms !important; }
}

/* Olen töissä */
.trip-card { width: 100%; text-align: left; font: inherit; color: inherit; border-style: dashed; border-color: rgba(229, 57, 59, .25); }
button.trip-card { background: var(--surface); }
.trip-card.on { border-style: solid; border-color: transparent; background: radial-gradient(120% 160% at 0% 0%, rgba(255, 211, 138, .12), transparent 60%) padding-box, linear-gradient(var(--surface), var(--surface)) padding-box, var(--card-edge) border-box; }
.trip-card .ic { color: #ff6a64; }

/* ---------- v4: siistimpi ulkoasu, musta-punainen teema ---------- */
:root {
  --bg: #000000;

.pop-item.danger, .pop-item.danger svg { color: var(--bad); }
.barcode-row { display: flex; gap: 8px; margin-top: 10px; }
.barcode-row .code { flex: 1; min-width: 0; height: 44px; border-radius: 13px; border: 1px solid var(--border-strong); background: var(--surface-2); color: var(--text); font-size: 16px; padding: 0 12px; outline: none; -webkit-appearance: none; }
.barcode-row .btn { height: 44px; padding: 0 16px; }
.food-sheet .src { margin: 6px 2px 0; font-size: 11.5px; }

/* ---------- Latausnäyttö ---------- */
#splash { position: fixed; inset: 0; z-index: 9999; background: radial-gradient(120% 70% at 50% 35%, #2a0d0e 0%, var(--bg) 60%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; transition: opacity .45s var(--ease), visibility .45s; }
#splash.out { opacity: 0; visibility: hidden; }
#splash .sp-logo { width: 84px; height: 84px; border-radius: 24px; background: var(--accent); display: grid; place-items: center; box-shadow: 0 18px 50px -12px rgba(229,57,59,.65); animation: spPop .7s var(--ease) both, spPulse 1.6s ease-in-out .7s infinite; }
#splash .sp-logo svg { width: 48px; height: 48px; fill: none; stroke: #fff; stroke-width: 2.2; stroke-linecap: round; }
#splash .sp-word { font: 800 34px/1 "Barlow Condensed", var(--font-display); letter-spacing: .14em; color: var(--text); animation: spUp .6s var(--ease) .15s both; }
#splash .sp-word span { color: var(--accent); }
#splash .sp-bar { width: 120px; height: 3px; border-radius: 3px; background: var(--surface-3); overflow: hidden; animation: spUp .6s var(--ease) .25s both; }
#splash .sp-bar i { display: block; height: 100%; width: 0; background: var(--accent); border-radius: 3px; animation: spLoad 1.3s var(--ease) .3s forwards; }
@keyframes spPop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes spPulse { 50% { transform: scale(1.05); } }
@keyframes spUp { from { transform: translateY(10px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes spLoad { to { width: 100%; } }
@media (prefers-reduced-motion: reduce) { #splash * { animation: none !important; } #splash .sp-bar i { width: 100%; } }

  }

  function morphNode(from, to) {
    if (from.nodeType === 3 || from.nodeType === 8) { if (from.nodeValue !== to.nodeValue) from.nodeValue = to.nodeValue; return; }
    const focused = from === document.activeElement;
    syncAttrs(from, to);
    const tag = from.nodeName;
    if (tag === 'INPUT') {
      if (!focused) {
        if (from.type === 'checkbox' || from.type === 'radio') from.checked = to.hasAttribute('checked');
        else if (from.value !== (to.getAttribute('value') || '')) from.value = to.getAttribute('value') || '';
      }
      return;
    }
    if (tag === 'TEXTAREA') { if (!focused && from.value !== to.value) from.value = to.value; return; }
    morphChildren(from, to);
  }

  /** Avaimelliset rivit (data-id) säilyvät, vaikka niiden järjestys muuttuu. */
  function morphChildren(from, to) {
    const b = Array.from(to.childNodes);
    const keyed = new Map();
    from.childNodes.forEach(n => { const k = keyOf(n); if (k && !keyed.has(k)) keyed.set(k, n); });
    for (let i = 0; i < b.length; i++) {
      const tc = b[i], fc = from.childNodes[i] || null, k = keyOf(tc);
      const m = k ? keyed.get(k) : null;
      if (m && m.nodeName === tc.nodeName) {
        keyed.delete(k);
        if (m !== fc) from.insertBefore(m, fc);
        morphNode(m, tc);
      } else if (fc && same(fc, tc) && !keyOf(fc)) {
        morphNode(fc, tc);
      } else {
        from.insertBefore(tc, fc);
      }
    }
    while (from.childNodes.length > b.length) from.removeChild(from.lastChild);
  }

  /** Päivittää elementin sisällön uuteen HTML:ään säilyttäen olemassa olevat solmut. */
  function morph(el, html) {
    const tpl = document.createElement('div');
    tpl.innerHTML = html;
    morphChildren(el, tpl);
  }

  /* ---------- Lukujen laskuri ---------- */
  function countUp(root) {
    if (reduce()) return;
    root.querySelectorAll('[data-count]').forEach(el => {
      const target = parseFloat(el.dataset.count);
      if (!isFinite(target) || target === 0) return;
      const dec = +(el.dataset.dec || 0);
      const dur = 700, t0 = performance.now();
      const fmt = v => v.toLocaleString('fi-FI', { minimumFractionDigits: dec, maximumFractionDigits: dec });
      const step = t => {
        const p = Math.min(1, (t - t0) / dur);
        const e = 1 - Math.pow(1 - p, 3);
        el.textContent = fmt(target * e);
        if (p < 1) requestAnimationFrame(step); else el.textContent = fmt(target);
      };
      el.textContent = fmt(0);
      requestAnimationFrame(step);
    });
  }

  /* ---------- Onnistumisanimaatio (konfetti) ---------- */
  function celebrate(x, y) {
    if (reduce()) return;
    const host = document.createElement('div');
    host.className = 'confetti';
    const colors = ['#e5393b', '#ff6a64', '#82d1ae', '#ffffff', '#ff9fb3'];
    const cx = x != null ? x : window.innerWidth / 2, cy = y != null ? y : window.innerHeight / 3;
    for (let i = 0; i < 28; i++) {
      const p = document.createElement('i');
      const ang = Math.random() * Math.PI * 2, dist = 70 + Math.random() * 120;
      p.style.left = cx + 'px'; p.style.top = cy + 'px';
      p.style.background = colors[i % colors.length];
      p.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
      p.style.setProperty('--dy', Math.sin(ang) * dist - 60 + 'px');
      p.style.setProperty('--r', (Math.random() * 720 - 360) + 'deg');
      p.style.animationDelay = (Math.random() * 60) + 'ms';
      host.appendChild(p);
    }
    document.body.appendChild(host);
    setTimeout(() => host.remove(), 1300);
  }

  /** Pieni "pomppu" painetulle elementille (esim. tehtävän kuittaus). */
  function pop(el) {
    if (!el || reduce()) return;
    el.classList.remove('popping'); void el.offsetWidth; el.classList.add('popping');
    setTimeout(() => el.classList.remove('popping'), 450);
  }

  /* ---------- Yläpalkin lasiefekti vierittäessä ---------- */
  let ticking = false;
  window.addEventListener('scroll', () => {
    if (ticking) return; ticking = true;
    requestAnimationFrame(() => { document.body.classList.toggle('scrolled', window.scrollY > 8); ticking = false; });
  }, { passive: true });

  window.GT = window.GT || {};
  GT.motion = { morph, countUp, celebrate, pop, reduce };
})();

</script>
<script>/* js/storage.js */
/* GymTrack – tallennuskerros
 *
 * Kaikki tallennus kulkee tämän moduulin kautta. Sovelluksen muu koodi ei
 * koske localStorageen suoraan. Pilvisynkronointi voidaan lisätä myöhemmin
 * rekisteröimällä uusi adapteri (Store.registerSync), jolle välitetään jokainen
 * tallennettu tila. Adapterin pitää toteuttaa push(state) ja halutessaan
 * pull() → Promise<state|null>.
 */
(function () {
  'use strict';

  const KEY = 'gymtrack.v1';
  const SCHEMA_VERSION = 1;

  const localAdapter = {
    name: 'local',
    read() {
      try {
        const raw = localStorage.getItem(KEY);
        return raw ? JSON.parse(raw) : null;
      } catch (e) {
        console.error('Lukuvirhe', e);
        return null;
      }
    },
    write(state) {
      try {
        localStorage.setItem(KEY, JSON.stringify(state));
        return true;
      } catch (e) {
        console.error('Tallennusvirhe', e);
        return false;
      }
    }
  };

  const syncAdapters = [];
  const listeners = [];
  let state = null;
  let saveTimer = null;

  function migrate(data) {
    if (!data || typeof data !== 'object') return null;
    if (!data.schema) data.schema = 1;
    // Tulevat skeemamuutokset tähän: if (data.schema < 2) { ...; data.schema = 2; }
    return data;
  }

  function flush() {
    clearTimeout(saveTimer);
    saveTimer = null;
    if (!state) return;
    state.updatedAt = new Date().toISOString();
    const ok = localAdapter.write(state);
    if (!ok && window.GT && GT.ui) GT.ui.toast('Tallennus epäonnistui – tallennustila voi olla täynnä', 'error');
    syncAdapters.forEach(a => {
      try { a.push && a.push(state); } catch (e) { console.warn('Synkronointivirhe', a.name, e); }
    });
  }

  const Store = {
    SCHEMA_VERSION,

    init(createDefault) {
      state = migrate(localAdapter.read());
      if (!state) {
        state = createDefault();
        state.schema = SCHEMA_VERSION;
        flush();
      }
      // Tallenna aina ennen kuin sivu suljetaan tai siirtyy taustalle
      window.addEventListener('pagehide', flush);
      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'hidden') flush();
      });
      return state;
    },

    get() { return state; },

    /** Muutos tilaan + automaattinen tallennus (debounce 250 ms). */
    update(mutator) {
      if (mutator) mutator(state);
      clearTimeout(saveTimer);
      saveTimer = setTimeout(flush, 250);
      listeners.forEach(fn => fn(state));
    },

    saveNow() { flush(); },

    onChange(fn) { listeners.push(fn); },

    exportJSON() {
      flush();
      return JSON.stringify({
        app: 'GymTrack',
        exportedAt: new Date().toISOString(),
        schema: SCHEMA_VERSION,
        data: state
      }, null, 2);
    },

    importJSON(text) {
      const parsed = JSON.parse(text);
      const data = parsed && parsed.app === 'GymTrack' ? parsed.data : parsed;
      if (!data || !Array.isArray(data.workouts) || !Array.isArray(data.sessions)) {
        throw new Error('Tiedosto ei ole GymTrack-varmuuskopio');
      }
      state = migrate(data);
      flush();
      listeners.forEach(fn => fn(state));
      return state;
    },

    reset(createDefault) {
      state = createDefault();
      state.schema = SCHEMA_VERSION;
      flush();
      listeners.forEach(fn => fn(state));
    },

    /** Pilvisynkronoinnin liityntäkohta tulevaisuutta varten. */
    registerSync(adapter) {
      syncAdapters.push(adapter);
      if (adapter.pull) {
        adapter.pull().then(remote => {
          if (remote && (!state.updatedAt || remote.updatedAt > state.updatedAt)) {
            state = migrate(remote);
            localAdapter.write(state);
            listeners.forEach(fn => fn(state));
          }
        }).catch(e => console.warn('Synkronoinnin haku epäonnistui', e));
      }
    }
  };

  window.GT = window.GT || {};
  GT.Store = Store;
})();

</script>
<script>/* js/model.js */
/* GymTrack – tietomalli, oletusohjelma ja laskennat */
(function () {
  'use strict';

  const uid = (p = 'id') => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  function ex(name, sets, repMin, repMax, variants) {
    const e = { id: uid('ex'), name, sets, repMin, repMax };
    if (variants) e.variants = variants;
    return e;
  }

  const DAYS = ['Maanantai', 'Tiistai', 'Keskiviikko', 'Torstai', 'Perjantai', 'Lauantai', 'Sunnuntai'];
  const DAYS_ESS = ['maanantaina', 'tiistaina', 'keskiviikkona', 'torstaina', 'perjantaina', 'lauantaina', 'sunnuntaina'];

  function defaultPlan(workouts) {
    const byName = n => { const w = workouts.find(x => x.name.toUpperCase() === n); return w ? w.id : null; };
    return {
      goal: 'Maksimaalinen lihasmassan kasvattaminen',
      guidelines: [
        'Palautukset: noin 60–90 sekuntia.',
        'Tee työsarjat hyvällä tekniikalla ja jätä yleensä 1–3 toistoa varastoon.',
        'Kun saat kaikissa sarjoissa toistoalueen ylärajan hyvällä tekniikalla, lisää hieman painoa.',
        'Kirjaa jokaisen sarjan painot ja toistot ylös.',
        'Aloita jokainen treeni riittävällä lämmittelyllä ja tee tarvittaessa kevyitä lämmittelysarjoja ennen raskaita liikkeitä.'
      ],
      // ma–su: treenipäivän id tai null (lepo)
      schedule: [byName('PULL'), null, byName('PUSH'), null, byName('LEGS'), null, null]
    };
  }

  /** Lisää ohjelman tavoitteen, ohjeet ja viikkorytmin vanhaan tallennukseen. */
  function ensurePlan(state) {
    if (state.plan) return false;
    state.plan = defaultPlan(state.workouts);
    return true;
  }

  function todayIndex(d = new Date()) { return (d.getDay() + 6) % 7; }

  /** Viikkorytmin mukainen seuraava treeni: { workout, offset, label, restToday } */
  function nextScheduled(state) {
    const plan = state.plan;
    if (!plan || !plan.schedule) return null;
    const wOf = id => id ? state.workouts.find(w => w.id === id) : null;
    if (!plan.schedule.some(wOf)) return null;
    const t = todayIndex();
    const todayStart = new Date(); todayStart.setHours(0, 0, 0, 0);
    const doneToday = finishedSessions(state).filter(s => new Date(s.startedAt) >= todayStart);
    const todayW = wOf(plan.schedule[t]);
    if (todayW && !doneToday.some(s => s.workoutId === todayW.id)) return { workout: todayW, offset: 0, label: 'Tänään', restToday: false };
    for (let i = 1; i <= 7; i++) {
      const w = wOf(plan.schedule[(t + i) % 7]);
      if (w) return { workout: w, offset: i, label: i === 1 ? 'Huomenna' : DAYS_ESS[(t + i) % 7].charAt(0).toUpperCase() + DAYS_ESS[(t + i) % 7].slice(1), restToday: !todayW, doneToday: !!todayW };
    }
    return null;
  }

  function createDefault() {
    const st = createBase();
    st.plan = defaultPlan(st.workouts);
    return st;
  }

  function createBase() {
    return {
      schema: 1,
      createdAt: new Date().toISOString(),
      settings: { restSeconds: 90, autoRest: true, sound: true },
      workouts: [
        {
          id: uid('w'), name: 'PULL', subtitle: 'Selkä + hauis',
          exercises: [
            ex('Alataljasoutu', 3, 8, 12),
            ex('Ylätalja / avustetut leuanvedot', 3, 8, 12, ['Ylätalja', 'Avustetut leuanvedot']),
            ex('Hauiskääntö Z-tangolla', 3, 8, 12),
            ex('Hammer-hauiskääntö', 3, 10, 15)
          ]
        },
        {
          id: uid('w'), name: 'PUSH', subtitle: 'Rinta + olkapäät + ojentajat',
          exercises: [
            ex('Vinopenkkipunnerrus käsipainoilla', 3, 8, 12),
            ex('Pystypunnerrus suoralla tangolla', 3, 6, 10),
            ex('Ojentajapunnerrus taljassa', 3, 10, 15),
            ex('Pec Deck', 3, 10, 15),
            ex('Vipunostot sivuille', 3, 12, 20)
          ]
        },
        {
          id: uid('w'), name: 'LEGS', subtitle: 'Jalat + vatsat',
          exercises: [
            ex('Jalkaprässi', 3, 6, 10),
            ex('Reisien ojennus', 3, 10, 15),
            ex('Reisien koukistus', 3, 10, 15),
            ex('Vatsarutistus lattialla', 3, 15, 20)
          ]
        }
      ],
      sessions: [],
      activeSessionId: null,
      measurements: [],
      rest: null
    };
  }

  /* ---------- Mittaustyypit ---------- */
  const MEASURES = {
    weight: { key: 'weight', label: 'Paino', unit: 'kg', step: 0.1, lowerIsBetter: null },
    biceps: { key: 'biceps', label: 'Hauis', unit: 'cm', step: 0.1, lowerIsBetter: false },
    chest: { key: 'chest', label: 'Rinta', unit: 'cm', step: 0.1, lowerIsBetter: false },
    waist: { key: 'waist', label: 'Vyötärö', unit: 'cm', step: 0.1, lowerIsBetter: true },
    bodyfat: { key: 'bodyfat', label: 'Rasvaprosentti', unit: '%', step: 0.1, lowerIsBetter: true }
  };

  /* ---------- Apufunktiot ---------- */
  const num = v => {
    if (v === '' || v === null || v === undefined) return null;
    const n = parseFloat(String(v).replace(',', '.'));
    return isFinite(n) ? n : null;
  };

  const setLogged = s => s && s.done && num(s.reps) > 0;

  /** Avain, jolla liikkeen historia yhdistetään. Variantit seurataan erikseen. */
  const exKey = (sessEx) => sessEx.variant ? sessEx.exerciseId + '::' + sessEx.variant : sessEx.exerciseId;
  const exLabel = (sessEx) => sessEx.variant || sessEx.name;

  /** Epley-kaava; luotettava vain kohtuullisilla toistomäärillä (1–12). */
  function e1rm(weight, reps) {
    weight = num(weight); reps = num(reps);
    if (!weight || !reps || reps < 1 || reps > 12) return null;
    if (reps === 1) return weight;
    return Math.round(weight * (1 + reps / 30) * 10) / 10;
  }

  function finishedSessions(state) {
    return state.sessions.filter(s => s.endedAt).sort((a, b) => b.startedAt.localeCompare(a.startedAt));
  }

  function activeSession(state) {
    return state.activeSessionId ? state.sessions.find(s => s.id === state.activeSessionId) || null : null;
  }

  function sessionStats(sess) {
    let sets = 0, volume = 0, reps = 0, exercises = 0;
    sess.exercises.forEach(e => {
      const done = e.sets.filter(setLogged);
      if (done.length) exercises++;
      done.forEach(s => {
        sets++;
        reps += num(s.reps) || 0;
        volume += (num(s.weight) || 0) * (num(s.reps) || 0);
      });
    });
    const end = sess.endedAt ? new Date(sess.endedAt) : new Date();
    const durationMs = Math.max(0, end - new Date(sess.startedAt));
    return { sets, volume: Math.round(volume), reps, exercises, durationMs };
  }

  /** Kaikki aiemmat kirjaukset liikkeelle (uusin ensin). */
  function exerciseHistory(state, key, excludeSessionId) {
    const out = [];
    finishedSessions(state).forEach(sess => {
      if (sess.id === excludeSessionId) return;
      sess.exercises.forEach(e => {
        if (exKey(e) !== key) return;
        const sets = e.sets.filter(setLogged);
        if (sets.length) out.push({ session: sess, entry: e, sets });
      });
    });
    return out;
  }

  function previousFor(state, key, excludeSessionId) {
    return exerciseHistory(state, key, excludeSessionId)[0] || null;
  }

  /** Ennätykset yhdelle liikkeelle annetusta historiasta. */
  function computePRs(history) {
    let maxWeight = null, bestE1rm = null, maxVolumeSet = null;
    const repsAtWeight = {};
    // vanhimmasta uusimpaan, jotta ensimmäinen saavutus jää päivämääräksi
    history.slice().reverse().forEach(h => {
      h.sets.forEach(s => {
        const w = num(s.weight) || 0, r = num(s.reps) || 0;
        const date = h.session.startedAt;
        if (!maxWeight || w > maxWeight.weight || (w === maxWeight.weight && r > maxWeight.reps)) maxWeight = { weight: w, reps: r, date };
        const est = e1rm(w, r);
        if (est && (!bestE1rm || est > bestE1rm.value)) bestE1rm = { value: est, weight: w, reps: r, date };
        if (!maxVolumeSet || w * r > maxVolumeSet.weight * maxVolumeSet.reps) maxVolumeSet = { weight: w, reps: r, date };
        const k = String(w);
        if (!repsAtWeight[k] || r > repsAtWeight[k].reps) repsAtWeight[k] = { weight: w, reps: r, date };
      });
    });
    return { maxWeight, bestE1rm, maxVolumeSet, repsAtWeight };
  }

  /** Tarkistaa onko sarja uusi ennätys verrattuna aiempiin treeneihin. */
  function checkSetPR(state, key, set, sessionId, currentSetsBefore) {
    const hist = exerciseHistory(state, key, sessionId);
    if (!hist.length) return [];
    // Mukaan myös saman treenin aiemmat sarjat, ettei samasta ilmoiteta kahdesti
    const all = hist.concat(currentSetsBefore && currentSetsBefore.length
      ? [{ session: { startedAt: new Date().toISOString() }, sets: currentSetsBefore }] : []);
    const pr = computePRs(all);
    const w = num(set.weight) || 0, r = num(set.reps) || 0;
    const res = [];
    if (pr.maxWeight && w > pr.maxWeight.weight) res.push({ type: 'weight', text: `Suurin paino: ${fmtKg(w)} × ${r}` });
    const est = e1rm(w, r);
    if (est && pr.bestE1rm && est > pr.bestE1rm.value && !res.length) res.push({ type: 'e1rm', text: `Arvioitu 1RM: ${fmtKg(est)}` });
    const prevAt = pr.repsAtWeight[String(w)];
    if (prevAt && r > prevAt.reps && !res.length) res.push({ type: 'reps', text: `${r} toistoa painolla ${fmtKg(w)}` });
    return res;
  }

  /** Kaikkien liikkeiden ennätykset (Ennätykset-näkymään). */
  function allPRs(state) {
    const keys = new Map();
    finishedSessions(state).forEach(sess => sess.exercises.forEach(e => {
      const k = exKey(e);
      if (!keys.has(k) && e.sets.some(setLogged)) keys.set(k, exLabel(e));
    }));
    const out = [];
    keys.forEach((label, key) => {
      const pr = computePRs(exerciseHistory(state, key));
      if (pr.maxWeight) out.push({ key, label, ...pr });
    });
    return out.sort((a, b) => (b.maxWeight.date || '').localeCompare(a.maxWeight.date || ''));
  }

  /** Viimeisimmät ennätystapahtumat (etusivulle). */
  function recentPRs(state, limit = 3) {
    const events = [];
    finishedSessions(state).forEach(sess => (sess.prs || []).forEach(p => events.push({ ...p, date: sess.startedAt, sessionId: sess.id })));
    return events.slice(0, limit);
  }

  function nextWorkout(state) {
    if (!state.workouts.length) return null;
    const last = finishedSessions(state)[0];
    if (!last) return state.workouts[0];
    const idx = state.workouts.findIndex(w => w.id === last.workoutId);
    if (idx === -1) return state.workouts[0];
    return state.workouts[(idx + 1) % state.workouts.length];
  }

  function startOfWeek(d = new Date()) {
    const x = new Date(d); x.setHours(0, 0, 0, 0);
    const day = (x.getDay() + 6) % 7; // ma = 0
    x.setDate(x.getDate() - day);
    return x;
  }

  function measurementsOf(state, type) {
    return state.measurements.filter(m => m.type === type).sort((a, b) => b.date.localeCompare(a.date) || (b.createdAt || '').localeCompare(a.createdAt || ''));
  }

  /** Kaikki seurattavat liikkeet: ohjelman liikkeet + historiasta löytyvät. */
  function trackableExercises(state) {
    const map = new Map();
    state.workouts.forEach(w => w.exercises.forEach(e => {
      if (e.variants && e.variants.length) e.variants.forEach(v => map.set(e.id + '::' + v, { key: e.id + '::' + v, label: v, group: w.name }));
      else map.set(e.id, { key: e.id, label: e.name, group: w.name });
    }));
    finishedSessions(state).forEach(s => s.exercises.forEach(e => {
      const k = exKey(e);
      if (!map.has(k)) map.set(k, { key: k, label: exLabel(e), group: 'Arkisto' });
    }));
    return Array.from(map.values());
  }

  function labelForKey(state, key) {
    const t = trackableExercises(state).find(x => x.key === key);
    return t ? t.label : 'Liike';
  }

  /* ---------- Muotoilut ---------- */
  const fi = 'fi-FI';
  function fmtKg(v) {
    v = num(v);
    if (v === null) return '–';
    return (Math.round(v * 100) / 100).toLocaleString(fi) + ' kg';
  }
  function fmtNum(v, digits = 1) {
    v = num(v);
    if (v === null) return '–';
    return v.toLocaleString(fi, { maximumFractionDigits: digits });
  }
  function fmtDate(iso, opts) {
    const d = new Date(iso);
    return d.toLocaleDateString(fi, opts || { day: 'numeric', month: 'numeric', year: 'numeric' });
  }
  function fmtDateLong(iso) {
    const d = new Date(iso);
    const s = d.toLocaleDateString(fi, { weekday: 'long', day: 'numeric', month: 'long' });
    return s.charAt(0).toUpperCase() + s.slice(1);
  }
  function fmtDuration(ms) {
    const m = Math.round(ms / 60000);
    if (m < 60) return m + ' min';
    return Math.floor(m / 60) + ' h ' + (m % 60) + ' min';
  }
  function fmtClock(ms) {
    const total = Math.max(0, Math.floor(ms / 1000));
    const h = Math.floor(total / 3600), m = Math.floor((total % 3600) / 60), s = total % 60;
    const pad = n => String(n).padStart(2, '0');
    return h ? `${h}:${pad(m)}:${pad(s)}` : `${pad(m)}:${pad(s)}`;
  }
  function relDay(iso) {
    const d = new Date(iso); d.setHours(0, 0, 0, 0);
    const t = new Date(); t.setHours(0, 0, 0, 0);
    const diff = Math.round((t - d) / 86400000);
    if (diff === 0) return 'Tänään';
    if (diff === 1) return 'Eilen';
    if (diff < 7) return diff + ' päivää sitten';
    return fmtDate(iso, { day: 'numeric', month: 'numeric' });
  }
  function todayISO() {
    const d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function setsSummary(sets) {
    const logged = sets.filter(setLogged);
    if (!logged.length) return '–';
    const ws = logged.map(s => num(s.weight) || 0);
    const allSame = ws.every(w => w === ws[0]);
    if (allSame) return (ws[0] ? fmtKg(ws[0]) + ' × ' : '') + logged.map(s => num(s.reps)).join(', ');
    return logged.map(s => (num(s.weight) || 0).toLocaleString(fi) + '×' + num(s.reps)).join(' · ');
  }

  window.GT = window.GT || {};
  GT.model = {
    uid, createDefault, MEASURES, DAYS, ensurePlan, defaultPlan, nextScheduled, todayIndex, num, setLogged, exKey, exLabel, e1rm,
    finishedSessions, activeSession, sessionStats, exerciseHistory, previousFor,
    computePRs, checkSetPR, allPRs, recentPRs, nextWorkout, startOfWeek,
    measurementsOf, trackableExercises, labelForKey
  };
  GT.fmt = { kg: fmtKg, num: fmtNum, date: fmtDate, dateLong: fmtDateLong, duration: fmtDuration, clock: fmtClock, relDay, todayISO, setsSummary };
})();
